<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><title>Idea Atlas</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2036%2036%22%3E%3Cpath%20fill%3D%22%231c3446%22%20d%3D%22M2%209.6c0-.8.4-1.5%201.2-1.8l9-4.4%2010.6%204.5%208.5-3.7c1-.5%202.2.2%202.2%201.3v21.4c0%20.8-.4%201.4-1.1%201.8l-9.6%204.5-10.6-4.6L4%2032.3c-1%20.5-2-.2-2-1.3Z%22%2F%3E%3Cpath%20fill%3D%22%23436073%22%20d%3D%22M12.2%203.4%2022.8%207.9v25.3l-10.6-4.6Z%22%2F%3E%3Cpath%20fill%3D%22%232d4c60%22%20d%3D%22m22.8%207.9%208.5-3.7c1-.5%202.2.2%202.2%201.3v21.4c0%20.8-.4%201.4-1.1%201.8l-9.6%204.5Z%22%2F%3E%3Cpath%20d%3D%22m5.8%2023.6%206.4-6.4%207.1%202.3%208.3-7.6%22%20fill%3D%22none%22%20stroke%3D%22%23d3eef6%22%20stroke-width%3D%222.45%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3Ccircle%20cx%3D%2227.6%22%20cy%3D%2211.9%22%20r%3D%223.1%22%20fill%3D%22%239ce5f5%22%20stroke%3D%22%232d4c60%22%20stroke-width%3D%221.1%22%2F%3E%3C%2Fsvg%3E">
<style>
*{box-sizing:border-box}
:root { 
  color-scheme:light;
  --ink:#232326; --mute:#616168; --line:#d8d8dc; --paper:#f7f7f8; --sheet:#fff;
  --accent:#0066c6; --accent-light:#eaf3fd; --hover:#ececef; --thread:#a7a7ad;
  --heading:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Consolas,monospace;
 }
html,body{height:100%;margin:0;color:var(--ink);font:14px/1.5 var(--heading);-webkit-font-smoothing:antialiased}
body{background:var(--paper)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
button:disabled{opacity:.4;cursor:default}
[hidden]{display:none!important}
svg.icon{width:18px;height:18px;vertical-align:middle;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{height:100%;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.topbar,.foot{flex:none;position:relative;z-index:2}

.topbar{display:flex;align-items:center;gap:14px;height:57px;padding-inline:clamp(16px,3vw,48px);z-index:5;background:#fff;border-bottom:1px solid #e5e5e8}
.brand{display:flex;align-items:center;gap:9px;white-space:nowrap;color:#353538;font-weight:640;font-size:15px;letter-spacing:.01em}
.atlas-mark{width:32px;height:32px;display:block;flex:none}
.mode-switch{display:flex;align-items:center;gap:1px;margin-left:auto;padding:3px;border-radius:9px;background:#ededf0}
.mode-switch button{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;min-height:28px;border:0;border-radius:6px;background:transparent;font-size:12px;font-weight:570;color:#55565b}
.mode-switch i,.filter-trigger i{display:inline-flex}
.mode-switch svg.icon,.filter-trigger svg.icon{height:15px;width:15px}
.mode-switch button[aria-pressed=true]{color:#202124;background:#fff;box-shadow:0 1px 4px #1e1f291a}
.mode-switch button:not([aria-pressed=true]):hover,.filter-trigger:hover{background:#e4e4e8}
.filter-host{position:relative;padding-left:12px;border-left:1px solid var(--line)}
.filter-trigger{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:34px;padding:4px 10px;font-size:13px;font-weight:540;border:0;border-radius:8px;color:#515258;background:transparent}
.filter-trigger[aria-expanded=true]{background:var(--hover)}
.filter-trigger.has-filter{color:var(--accent);background:var(--accent-light)}
#filterTotal{font-variant-numeric:tabular-nums;font-size:11px}
.filter-list{position:absolute;right:0;top:calc(100% + 9px);min-width:203px;padding:6px;display:grid;border:1px solid var(--line);border-radius:13px;background:var(--sheet);box-shadow:0 10px 32px #10131a1c,0 2px 6px #10131a0b}
.filter{display:flex;align-items:center;gap:7px;padding:7px 10px;min-height:34px;border:0;border-radius:7px;text-align:left;background:transparent;color:var(--ink);font-size:13px}
.filter:hover{background:var(--hover)}
.filter[aria-pressed=true]{font-weight:620;background:var(--accent-light);color:var(--accent)}
.count{margin-left:auto;font-size:12px;font-variant-numeric:tabular-nums}
.filter-sep{height:1px;margin:5px 9px;background:var(--line)}
.divider{width:1px;height:14px;flex:none;background:var(--line);margin:0 5px}
.statusmark{display:inline-block;width:7px;height:7px;flex:none}
.live{color:var(--mute)}
.mark-live{border-radius:50%;background:#34815c}
.needs-evidence{color:var(--mute)}
.mark-needs-evidence{border:1.65px solid #93702f;transform:rotate(45deg);border-radius:1px}
.killed{color:var(--mute)}
.mark-killed{position:relative;width:8px;height:8px}
.mark-killed:before,.mark-killed:after{content:"";position:absolute;top:3px;left:0;width:8px;height:1.6px;background:#73737a;transform:rotate(45deg)}
.mark-killed:after{transform:rotate(-45deg)}
.mark-variant,.mark-seed,.mark-duplicate{border:1.5px solid #73737a;border-radius:2px}
.surface{flex:1;min-height:0;display:flex;position:relative}
.main{flex:1;min-width:0;position:relative}
.mapview { position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab;background:var(--paper) }
.mapview:focus-visible{outline-offset:-4px}
.mapview.drag{cursor:grabbing;user-select:none}
.world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.wires{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}

/* The overview has three levels: a document title, section headings, and grouped rows. */
.wire,.active-edge {
  fill:none; stroke:#c5c7cb; stroke-width:1; stroke-linecap:round; stroke-linejoin:round;
  vector-effect:non-scaling-stroke;
}
.active-edge { stroke:#6995bf; stroke-width:1.5 }
.wire.dim { opacity:.38 }
#groups { position:absolute; inset:0; pointer-events:none }
.group-surface {
  position:absolute; border-radius:16px; background:var(--sheet);
  box-shadow:0 1px 3px #161b2710, 0 0 0 1px #161b2709;
}
.node {
  position:absolute; appearance:none; border:0; background:transparent;
  min-width:0; padding:0; text-align:left; cursor:pointer; user-select:none;
  color:var(--ink); overflow-wrap:anywhere;
}
.node:focus-visible { z-index:1; outline-width:2px; outline-offset:2px }
.node.dim { opacity:.38 }
.root-node,.lens-node { display:flex; flex-direction:column; align-items:flex-start; border-radius:6px }
.root-meta,.lens-meta,.idea-title,.badge { display:flex; align-items:center }
.root-node strong {
  order:0; font-size:39px; line-height:1.19; font-weight:730; letter-spacing:-.035em; text-wrap:balance;
}
.root-meta { order:1; gap:10px; margin-top:12px; font-size:13px; font-weight:500; color:var(--mute) }
.lens-node { padding:0 4px; gap:7px }
.lens-meta { width:100%; gap:9px; align-items:baseline }
.lens-meta strong { font-size:23px; line-height:1.3; font-weight:680; letter-spacing:-.025em }
.lens-letter { flex:none; white-space:nowrap; font:500 11px/1.4 var(--mono); color:var(--mute) }
.lens-text { color:#575b62; line-height:1.48; font-size:14px; padding-right:8px }
.root-node:hover strong,.lens-node:hover strong { color:#333d50 }
.idea-node {
  display:flex; flex-direction:column; justify-content:center; gap:4px;
  padding:14px 16px; border-radius:0;
}
.idea-node.first { border-radius:16px 16px 0 0 }
.idea-node.last { border-radius:0 0 16px 16px }
.idea-node.first.last { border-radius:16px }
.idea-node:not(.first)::before {
  content:""; position:absolute; left:16px; right:16px; top:0; height:1px; background:#e7e7ea;
}
.idea-title { width:100%; justify-content:space-between; align-items:baseline; gap:10px }
.idea-title strong { font-size:17px; font-weight:610; line-height:1.38 }
.idea-node .micro { font-size:13px; line-height:1.55; color:#676970 }
.badge { display:inline-flex; flex:none; gap:5px; white-space:nowrap; color:var(--mute); font:12px/1.45 var(--heading) }
.idea-node .badge { font-size:11px }
.idea-node:hover { background:#f0f2f5 }
.idea-node.selected { background:#e7f0fc }
.lens-node.selected strong,.root-node.selected strong { color:#185588 }
.idea-node.killed-card .idea-title strong { color:#686970 }
@media(prefers-contrast:more) {
  .wire { stroke:#81838a }
  .active-edge { stroke:#225e97; stroke-width:2 }
  .idea-node:not(.first)::before { background:#a0a0a4 }
  .node.dim { opacity:1; outline:1px dashed #78797d; outline-offset:-2px }
}
.foot{height:42px;padding:0 clamp(14px,2.1vw,34px);gap:14px;background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;color:var(--mute);font-size:12px}
.zoom-tools{display:flex;align-items:center;gap:2px}
.tool{background:transparent;border:0;display:inline-flex;align-items:center;justify-content:center;gap:5px;border-radius:5px;height:30px;min-width:30px;padding:3px 6px;color:var(--ink);font-size:12px}
.tool:hover{background:var(--hover)}
.tool.percent{font:12px var(--mono);min-width:45px}
.foot-end{margin-left:auto;white-space:nowrap;font-variant-numeric:tabular-nums}
.keyhint{font-size:11.5px}

@media(max-width:820px){
  .topbar{height:52px;gap:9px}
  .foot{gap:8px}.keyhint{display:none}
}
@media(max-width:650px){
  .topbar{height:52px;padding:0 12px}.filter-host{padding-left:6px}.atlas-mark{width:29px;height:29px}.filter-trigger{padding:4px 6px}.filter{min-height:42px}
  .brand{font-size:16px;font-weight:620;color:var(--ink)}
  .mode-switch button{font-size:12px;padding:5px 8px;gap:5px}
  
  .root-node strong{font-size:30px}.lens-meta strong{font-size:21px}.foot{padding:0 9px;height:38px}.foot-end{font-size:11px}
}

.index-view {
  height:100%; overflow:auto; container-type:inline-size; background:#fff;
  padding:24px clamp(16px,4vw,62px) 40px; color:var(--ink);
}
.index-heading, #indexTable { max-width:1360px; margin-inline:auto }
.index-heading { display:flex; align-items:baseline; gap:12px; margin-bottom:18px }
.index-heading h2 { font:720 23px/1.35 var(--heading); letter-spacing:-.025em; margin:0 }
.index-heading span { color:var(--mute); font-size:13px; font-variant-numeric:tabular-nums }
.pa-index { font-size:14px; line-height:1.55; overflow-wrap:anywhere }
.pa-index table { width:100%; border-collapse:separate; border-spacing:0; text-align:left }
.pa-index th,.pa-index td { vertical-align:middle; padding:13px 12px; border:0; border-bottom:1px solid var(--line) }
.pa-index thead th {
  position:sticky; top:-24px; z-index:1; background:var(--paper);
  font-weight:620; color:var(--mute); font-size:12px; padding-block:8px;
}
.pa-index thead th:first-child { border-radius:6px 0 0 0 }
.pa-index thead th:last-child { border-radius:0 6px 0 0 }
.pa-index tbody th { width:29%; font-weight:inherit }
.pa-index .pa-branchcol { width:18% }
.pa-index tbody td:last-child { width:1%; white-space:nowrap }
.pa-indexopen,.pa-cardlink { color:inherit; font:inherit; text-align:left; cursor:pointer }
.pa-indexopen {
  display:flex; align-items:baseline; gap:10px; padding:5px 2px; border:none; background:transparent;
  width:100%; border-radius:3px;
}
.pa-indexopen strong { font-size:15px; line-height:1.45; font-weight:680 }
.pa-id { font:600 11.5px/1.6 var(--mono); color:var(--mute) }
.pa-indexopen .pa-id,.pa-cardlink .pa-id {
  flex:none; font-variant-numeric:tabular-nums; color:var(--mute);
  background:var(--hover); border-radius:4px; padding:1px 5px;
}
.pa-index tr:focus-within,.pa-index tbody tr:hover,.pa-index tbody tr:has([aria-current="true"]) { background:var(--paper) }
.pa-indexopen:hover strong,.pa-indexopen[aria-current="true"] strong { color:var(--accent) }
.pa-branchname { display:inline-flex; align-items:baseline; gap:6px; font-weight:600; font-size:13px }

.pa-indexscene,.pa-cardlink small { display:block; color:var(--mute); line-height:1.5; font-size:12px; font-weight:400 }
.pa-indexscene:not(:empty) { margin-block:2px }
.pa-index .badge,.drawer .badge { font-size:12px }
.pa-empty { padding:24px 0; color:var(--mute); border-top:1px solid var(--line) }
@container (max-width:560px) {
  .pa-index table,.pa-index tbody { display:block }
  .pa-index thead { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%) }
  .pa-index tbody tr { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:3px 10px; padding:14px 2px; border-bottom:1px solid var(--line) }
  .pa-index tbody th,.pa-index tbody td,.pa-index .pa-branchcol,.pa-index tbody td:last-child { border:0; min-width:0; width:auto; padding:0 }
  .pa-index tbody th { grid-area:1/1 }
  .pa-index tbody .pa-branchcol { grid-area:2/1 /3/-1; padding-block:0 3px }
  .pa-index tbody td:nth-child(3) { grid-area:3/1 /4/-1; font-size:14px }
  .pa-index tbody td:last-child { grid-area:1/2; align-self:center }
  .pa-indexopen { gap:6px }
  .pa-branchname { font-size:12px }
}
.drawer {
  width:clamp(345px,31vw,465px); min-height:0; flex:none; display:flex; flex-direction:column;
  z-index:3; background:#fff; color:var(--ink); border-left:1px solid var(--line);
}
.drawer-head {
  flex:none; padding:14px 23px 17px; border-bottom:1px solid var(--line);
  background:var(--sheet); position:relative; overflow-wrap:anywhere;
}

.drawer-top { display:flex; align-items:center; justify-content:space-between; gap:10px }
.drawer-k { font-size:12px; color:var(--mute); line-height:1.5 }

.drawer-head h2 { font:680 30px/1.3 var(--heading);margin:13px 0 2px;letter-spacing:-.025em }
.close-btn { display:grid;place-items:center;flex:none;width:32px;height:32px;border:0;border-radius:50%;color:var(--mute);background:var(--hover) }
.close-btn:hover { background:var(--line) }
.drawer-body { flex:auto; min-height:0; padding:17px 23px 36px; overflow:auto; overscroll-behavior:contain }
.pa-detail { font-size:14px; line-height:1.65; overflow-wrap:anywhere }
.pa-muted { color:var(--mute); font-size:13px; margin:8px 0 14px }
.pa-question { font-size:16px; font-weight:620; line-height:1.65; margin:12px 0 18px; color:var(--ink) }
.pa-section + .pa-section,.pa-fields + .pa-section { margin-top:24px }
.pa-detail h3 { display:flex;align-items:center;gap:8px;margin:0;padding-block:6px;border-bottom:1px solid var(--line);font:660 15px/1.5 var(--heading);color:var(--ink) }
.pa-detail h3 .pa-id { color:var(--mute); font-size:11px }
.pa-fields { width:100%; border-collapse:collapse; text-align:left; table-layout:fixed }
.pa-fields th,.pa-fields td { padding:8px 0; border-bottom:1px solid var(--line); vertical-align:top }
.pa-fields th { width:6.4em; padding-right:12px; font-size:12px; font-weight:520; color:var(--mute) }
.pa-fields td { line-height:1.65 }

.pa-links { display:grid }
.pa-cardlink {
  display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:baseline; gap:9px; width:100%;
  border:0; border-bottom:1px solid var(--line); background:transparent; padding:12px 2px;
}
.pa-cardlink:hover { background:var(--paper) }
.pa-cardlink strong { display:block; font-weight:640 }
.pa-cardlink small { margin-top:2px }
.pa-open-icon { color:var(--mute); font-size:14px }
@media(max-width:820px) { .drawer { width:330px } }
@media(max-width:650px) {
  .index-view { padding:16px 14px 28px }
  .index-heading { margin-bottom:8px }
  .index-heading h2 { font-size:20px }
  .drawer { position:absolute; inset:0 0 0 auto; width:min(100%,415px); box-shadow:-6px 0 18px #00000010 }
  .drawer-head { padding:12px 16px }
  .drawer-head h2 { font-size:26px }
  .filter-host .filter-list{max-width:calc(100vw - 24px);max-height:calc(100dvh - 70px);overflow:auto}

  .drawer-body { padding:15px 16px 32px }
  .close-btn { width:38px; height:38px }
}
/* The card reader has its own scrolling document. The map and branch inspectors stay independent. */
.drawer.card-open {
  --reader-pad:clamp(24px,2.65vw,42px);
  --reader-line:#e6e6e9;
  --reader-muted:#64656b;
  --reader-ink:#222326;
  width:clamp(430px,39vw,584px);
  background:#fff; color:var(--reader-ink); border-left:1px solid #dbdbdf;
}
.card-open .drawer-head { padding:9px var(--reader-pad) 7px; border:0; background:#fff; }
.card-open .drawer-top { min-height:32px; }
.card-open #drawerPath {
  display:flex; align-items:center; flex-wrap:nowrap; gap:7px; min-width:0;
  line-height:1.35; font-size:12.5px; color:var(--reader-muted);
}
.card-open .crumb-link {
  appearance:none; border:0; padding:5px 0; background:none; color:inherit; font:inherit;
  min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.card-open .crumb-link:hover { text-decoration:underline; text-underline-offset:3px; }
.card-open .crumb-sep { color:#93949b; }
.card-open .card-code { flex:none; letter-spacing:.03em; font-variant-numeric:tabular-nums; }
.card-open .compact-title { display:none; }
.card-open.scrolled .compact-title {
  display:inline; overflow:hidden; white-space:nowrap; text-overflow:ellipsis;
  color:var(--reader-ink); font-weight:620;
}
.card-open .close-btn { width:30px; height:30px; background:#f1f1f3; }
.card-open .close-btn:hover { background:#e7e7ea; }
.card-open .close-btn .icon { width:15px; height:15px; }
.card-open .drawer-body {
  padding:0; min-width:0; scrollbar-gutter:stable; scroll-padding-top:52px;
  overflow-x:hidden; overflow-y:auto; overflow-wrap:anywhere;
}
.card-open .card-hero { padding:12px var(--reader-pad) 18px; }
.card-open #drawerTitle {
  font:720 clamp(30px,2.5vw,37px)/1.2 var(--heading);
  margin:0; letter-spacing:-.025em; text-wrap:balance;
}
.card-open .card-promise { margin:7px 0 0; font-size:17px; line-height:1.5; color:#505158; }
.card-open .card-meta {
  display:flex; align-items:center; flex-wrap:wrap; gap:5px 12px;
  font-size:12px; color:var(--reader-muted); margin-top:13px;
}
.card-open .card-meta .badge { font-size:12px; }
.card-open .card-tabs {
  position:sticky; top:0; z-index:2; display:flex; align-items:stretch; gap:clamp(16px,2.5vw,30px);
  padding:0 var(--reader-pad); background:#fff; box-shadow:inset 0 -1px var(--reader-line);
}
.card-open .card-tabs button {
  position:relative; min-height:44px; display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
  padding:4px 1px; border:0; background:transparent; font-size:14px; color:var(--reader-muted); font-weight:550;
}
.card-open .card-tabs button[aria-selected="true"] { color:var(--reader-ink); font-weight:680; }
.card-open .card-tabs button[aria-selected="true"]::after {
  content:""; position:absolute; inset:auto 0 0; height:2px; background:currentColor; border-radius:2px;
}
.card-open .tab-count { font-size:11px; color:var(--reader-muted); font-variant-numeric:tabular-nums; }
.card-open .card-pane { padding:24px var(--reader-pad) 42px; font-size:15px; line-height:1.7; }
.card-open .reading-section,.card-open .decision-summary,.card-open .reading-context { margin:0 0 24px; }
.card-open .reading-section h3 {
  margin:0 0 8px; color:var(--reader-muted); font-size:12.5px; line-height:1.45; font-weight:620;
}
.card-open .reading-section p,.card-open .fold-body p { margin:5px 0 0; }
.card-open .reading-section .reading-headline,.card-open .reading-lead {
  margin:0 0 7px; color:var(--reader-ink); font-weight:640; font-size:19px; line-height:1.5; letter-spacing:-.015em;
}
.card-open .reading-section p:not(.reading-headline),.card-open .fold-body { color:#45464b; }
.card-open .reading-context {
  padding:15px 18px; border-radius:12px; background:#f5f5f7;
}
.card-open .context-main { margin:0; color:var(--reader-ink); font-size:15px; font-weight:610; }
.card-open .context-time { font-size:13px; color:var(--reader-muted); }
.card-open .reading-context p { margin:6px 0 0; }
.card-open .reading-fields,.card-open .measure-list { margin:0; }
.card-open .reading-fields > div,.card-open .measure-list > div {
  display:grid; grid-template-columns:minmax(4em,5em) minmax(0,1fr); column-gap:16px; padding:8px 0;
}

7":{"id":"C17","title":"牛蹄量脚器与「牛用尺码」体系","status":"live","statusReason":"是 C16/C08 的前置工具，两周可用亚克力刻度垫＋打印卡尺做出，测量重复性可当天测；本身也能独立卖给制作者与研究者。","family":"F13 牛蹄尺码","reading":"R5","insight":"要让'给牛做鞋'成为一个行业而不是一个玩笑，先得有尺码——这是把玩笑变成基础设施的最小一步，也是唯一不依赖任何牛配合的卡。","role":"度量工具：把'牛蹄'从一个模糊印象变成 6 个可下单的尺码","occasion":"每次做鞋打样前、兽医建档、蹄修培训","freq":"每头牛一次建档，每双鞋一次选码","current":"软尺量蹄宽、凭经验选壳，数据不互通、换人就不同","relationship":"制鞋方、蹄修师、兽医、研究者","sub":"替代：一把游标卡尺＋一张手写表（几十元）。代价：两趾夹角、蹄冠周长量不准，两个人量出两套数。","gap":"没有共同尺码，每双鞋都得单独扫描，打样成本下不来。有了 6 个标准码＋一张量脚卡，第二双鞋才可能便宜。","promise":"量三处，报一个码。","mechanism":"一把三爪量具（蹄宽、蹄长、两趾夹角）＋一张可拍照的刻度垫＋6 个码（N1–N6）；手机拍照自动读刻度并生成订单号。","how":"牛站平 → 蹄放刻度垫 → 三爪卡住 → 拍照 → 出码 → 下单/建档","action":"亚克力刻度垫＋3D 打印三爪卡，量 20 头牛，同一头牛由两人各测一次，算差值。","tradeoff":"只在有人真要做牛鞋时才有用；市场规模极小，且完全依附 C16/C08。","proof":"proposed：同一头牛两名测量者差值 ≤2mm 的比例 ≥85%（n=20）。","kill":"两周内 20 头牛、2 名测量者：若差值 \u003e4mm 的比例 ≥30%，说明蹄部手工测量本身不稳定，转做 3D 扫描服务。","claim":"牛蹄可以被标准化成 6 个尺码，且手工量具足够稳定。","evidence":"grey","evidenceNotes":"需求：灰——无制鞋方或牧场的需求材料。机制：灰——测量重复性是纯工程问题，两周可测；但本卡价值完全依附于 C16/C08 是否成立。","links":"C16, C08"},"C18":{"id":"C18","title":"成人跑鞋直接绑上牛蹄","status":"killed","statusReason":"硬失败：牛蹄没有后跟与踝，绑带只能勒在蹄冠软组织上；结构与解剖不兼容，且不提供任何新机制（与 C16 同一道固定题）。保留在此，避免重复提出。","family":"F14 直接套用","reading":"R5","insight":"字面读法最容易滑向'把现成跑鞋绑上去'。把它显式写出来再 kill，是为了逼出 C16 的两瓣结构——排除法也是设计产出。","role":"最直觉的做法：买一双大码跑鞋，用胶带缠上","occasion":"一次性拍摄","freq":"一次","current":"胶带或绳子绑","relationship":"牛、饲养员","sub":"它本身就是最便宜的替代（\u003c500 元、10 分钟）。代价：鞋在 3–5 步内翻转，且胶带压迫蹄冠。","gap":"无——它假设'绑紧就行'，而这个假设在解剖上不成立；没有新缺口，也没有新机制。","promise":"十分钟就能让牛'穿上跑鞋'。","mechanism":"大码跑鞋＋布基胶带绕蹄冠两圈。","how":"套鞋 → 缠胶带 → 牵走 → 鞋翻转","action":"只做 1 次 10 步的对照拍摄留档，不进入打样。","tradeoff":"胶带压迫蹄冠有受伤风险；鞋底刚度不适合两趾独立活动。","proof":"proposed：10 步内保持位置 ≥8 步（预期不达标）。","kill":"不需要两周：一次 10 步试穿即可判定。若鞋在 5 步内翻转或牛出现跺脚，永久 kill。","claim":"（被否）'绑紧'足以把跑鞋固定在牛蹄上。","evidence":"grey","evidenceNotes":"需求：不适用（连机制都不成立）。机制：灰——'无后跟、无踝'是解剖推论而非实测，但足以在不做动物试验的前提下筛掉；记录在此以免重复提出。","links":"C16"}},"grill":{"C16":{"rounds":[{"q":"牛蹄没有踝和后跟，跑鞋靠什么固定？","consider":"鞋带只能落在蹄冠上    state.scale=clamp(Math.min(1,widthScale),minZoom,1);
   state.x=(w-geometry.w*state.scale)/2;
   state.y=state.mobile?28:clamp(h*.055,26,54);
 }else{
   state.scale=clamp(Math.min(widthScale,(h-48)/geometry.h,1.08),minZoom,maxZoom);
   state.x=(w-geometry.w*state.scale)/2;state.y=(h-geometry.h*state.scale)/2;
 }
 state.auto=true;transform();
}
function zoom(z,x=view.clientWidth/2,y=view.clientHeight/2){
 const next=clamp(z,minZoom,maxZoom), ratio=next/state.scale;
 state.x=x-(x-state.x)*ratio;state.y=y-(y-state.y)*ratio;state.scale=next;state.auto=false;transform();
}
function keepVisible(key){
 const b=geometry.rects.get(key);if(!b||!view.clientWidth||(!drawer.hidden&&(window.innerWidth<=650||drawer.getAttribute('aria-modal')==='true')))return;
 const pad=22,s=state.scale,w=view.clientWidth,h=view.clientHeight;
 const x=state.x+b.x*s,y=state.y+b.y*s;
 if(x+b.w*s>w-pad)state.x-=x+b.w*s-(w-pad);else if(x<pad)state.x+=pad-x;
 if(y+b.h*s>h-pad)state.y-=y+b.h*s-(h-pad);else if(y<pad)state.y+=pad-y;
 transform();
}
const narrowReader=window.matchMedia('(max-width:700px)');
function syncReaderMode(){
 const full=narrowReader.matches && !drawer.hidden && drawer.classList.contains('card-open');
 for(const surface of document.querySelectorAll('.topbar,.main,.foot')) surface.inert=full;
 if(full){drawer.setAttribute('role','dialog');drawer.setAttribute('aria-modal','true')}
 else{drawer.removeAttribute('role');drawer.removeAttribute('aria-modal')}
}
listen(narrowReader,'change',syncReaderMode);
function openDetail(key,trigger){
 const c=DATA.cards[key],id=key.startsWith(branchPrefix)?key.slice(branchPrefix.length):null;
 const l=id===null?null:branches[id];
 if(!c&&!l&&key!=='root')return;
 if(trigger&&!drawer.contains(trigger))lastTrigger=trigger;
 state.selected=key;
 drawer.hidden=false;
 const openingBranch=c?c[branchType]:id;
 if(openingBranch===null)delete drawer.dataset.tone;
 else drawer.dataset.tone=branchTone.get(openingBranch);
 syncIndexSelection();

 const heading=$('drawerTitle'), body=$('drawerBody');
 const fromDrawer=trigger && drawer.contains(trigger);
 heading.remove();
 drawer.classList.toggle('card-open',!!c);
 drawer.classList.remove('scrolled');
 if(c){
   $('drawerPath').innerHTML='<button type="button" class="crumb-link" data-'+branchType+'="'+esc(c[branchType])+'">'+
     esc(branches[c[branchType]].name)+'</button><span class="crumb-sep" aria-hidden="true">›</span><span class="card-code">'+esc(c.id)+
     '</span><span class="compact-title" aria-hidden="true">'+esc(c.title)+'</span>';
 }else{
   $('drawerPath').textContent=l?t("Brief  ›  ", "课题  ›  ")+(reframed?t("Perspectives", "题目读法"):t("Lenses", "探索视角")):t("Idea Atlas  ›  Brief", "点子地图  ›  课题");
 }
 heading.lang=DATA.language||'';heading.dir='auto';
 heading.textContent=c?c.title:l?l.name:brief;
 body.innerHTML=c?cardDetail(c):l?branchDetail(id):projectDetail();
 if(c)body.querySelector('.card-hero').prepend(heading);
 else drawer.querySelector('.drawer-head').append(heading);
 body.scrollTop=0;syncReaderMode();paint();
 if(state.mode==='map')keepVisible(key);
 if(state.mobile||fromDrawer||trigger?.matches(':focus-visible'))$('closeDrawer').focus({preventScroll:true});
}
function updateDetailHeader(){
 const body=$('drawerBody'),hero=body.querySelector('.card-hero');
 drawer.classList.toggle('scrolled',!!hero && body.scrollTop>=hero.offsetHeight-6);
}
function showCardTab(tab) {
 const body=$('drawerBody');
 const hero=body.querySelector('.card-hero');
 const y=Math.min(body.scrollTop,hero.offsetHeight);
 for(const other of tab.parentElement.querySelectorAll('[role=tab]')){
   const active=other===tab;
   other.setAttribute('aria-selected',String(active));
   other.tabIndex=active?0:-1;
   $(other.getAttribute('aria-controls')).hidden=!active;
 }
 body.scrollTop=y;
 updateDetailHeader();
}
$('drawerBody').addEventListener('scroll',updateDetailHeader,{passive:true});
$('drawerBody').addEventListener('click',e=>{
 const tab=e.target.closest('[role=tab]');
 if(tab) showCardTab(tab);
});
$('drawerBody').addEventListener('keydown',e=>{
 const tab=e.target.closest('[role=tab]');
 if(!tab || !['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;
 const tabs=[...tab.parentElement.querySelectorAll('[role=tab]')],i=tabs.indexOf(tab);
 const next=e.key==='Home'?0:e.key==='End'?tabs.length-1:(i+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;
 e.preventDefault(); tabs[next].focus({preventScroll:true}); showCardTab(tabs[next]);
});

function syncIndexSelection(){
 for(const button of $('indexTable').querySelectorAll('.pa-indexopen')){
  if(button.dataset.card===state.selected)button.setAttribute('aria-current','true');
  else button.removeAttribute('aria-current');
 }
}
function closeDetail(restore=false){
 if(drawer.hidden)return;
 drawer.hidden=true;syncReaderMode();state.selected=null;syncIndexSelection();paint();
 if(state.auto&&state.mode==='map')fitView(true);
 if(restore&&lastTrigger?.isConnected)lastTrigger.focus({preventScroll:true});
 lastTrigger=null;
}
function setFilter(f){
 if(!rules.some(r=>r[0]===f))return;
 state.filter=f;
 const match=matched();
 const filterRule=rules.find(rule=>rule[0]===f);
 $('filterLabel').textContent=f==='all'?t("Filter", "筛选"):filterRule[1];
 $('filterTotal').textContent=match.length;
 $('filterTotal').hidden=f==='all';
 $('filterTrigger').classList.toggle('has-filter',f!=='all');
 $('filterTrigger').setAttribute('aria-label',t('Filter ideas. Selected: '+filterRule[1]+', '+ideaCount(match.length),'筛选方向，当前为'+filterRule[1]+t(", ", "，")+match.length+' 个方向'));
 if(!$('filters').hidden) toggleFilters(false,true);
 if(state.selected&&DATA.cards[state.selected]&&!match.includes(DATA.cards[state.selected]))closeDetail();
 if(f!=='all'&&state.selected?.startsWith(branchPrefix)&&!match.some(c=>branchKey(c)===state.selected))closeDetail();
 $('filters').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.filter===f)));
 $('indexTable').innerHTML=indexContent(match);syncIndexSelection();$('indexCount').textContent=ideaCount(match.length);paint();
}
function setMode(mode){
 state.mode=mode;closeDetail();
 const map=mode==='map';view.hidden=!map;$('indexView').hidden=map;$('zoomTools').hidden=!map;$('keyHint').hidden=!map;
 $('modeMap').setAttribute('aria-pressed',String(map));$('modeIndex').setAttribute('aria-pressed',String(!map));
 if(map&&needsLayout())draw();
 if(map&&state.auto)fitView(true);
}
let swallowClick=false;
listen(document,'click',e=>{
 if(swallowClick&&view.contains(e.target)){e.preventDefault();return}
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.card)openDetail(b.dataset.card,b);
 else if(b.dataset[branchType])openDetail(branchPrefix+b.dataset[branchType],b);
 else if('root' in b.dataset)openDetail('root',b);
 else if(b.dataset.filter)setFilter(b.dataset.filter);
});
$('closeDrawer').onclick=()=>closeDetail(true);$('modeMap').onclick=()=>setMode('map');$('modeIndex').onclick=()=>setMode('index');
$('zoomIn').onclick=()=>zoom(state.scale*1.25);$('zoomOut').onclick=()=>zoom(state.scale/1.25);$('actual').onclick=()=>zoom(1);$('fit').onclick=()=>fitView();
view.addEventListener('focusin',e=>{
 const button=e.target.closest('.node');
 state.focus=button?.matches(':focus-visible')?button.dataset.key:null;
 if(state.focus) keepVisible(state.focus);
 paint();
});
view.addEventListener('focusout',()=>{state.focus=null;paint()});
const pointers=new Map();let gesture=null,didDrag=false;
function beginGesture(){
 const p=[...pointers.values()];if(!p.length){gesture=null;return}
 const a=p[0],b=p[1]||a;
 gesture={x:(a.x+b.x)/2,y:(a.y+b.y)/2,d:Math.hypot(a.x-b.x,a.y-b.y),tx:state.x,ty:state.y,s:state.scale};
}
view.addEventListener('pointerdown',e=>{
 if(e.button!==0)return;const r=view.getBoundingClientRect();
 if(!pointers.size){didDrag=false;swallowClick=false}
 pointers.set(e.pointerId,{x:e.clientX-r.left,y:e.clientY-r.top});beginGesture();
 if(pointers.size>1)didDrag=true;
});
view.addEventListener('pointermove',e=>{
 if(!pointers.has(e.pointerId)||!gesture)return;
 const r=view.getBoundingClientRect();pointers.set(e.pointerId,{x:e.clientX-r.left,y:e.clientY-r.top});
 const [a,b=a]=[...pointers.values()],x=(a.x+b.x)/2,y=(a.y+b.y)/2;
 if(!didDrag&&Math.hypot(x-gesture.x,y-gesture.y)<4)return;
 didDrag=true;view.setPointerCapture(e.pointerId);view.classList.add('drag');state.auto=false;
 const next=gesture.d>0?clamp(gesture.s*Math.hypot(a.x-b.x,a.y-b.y)/gesture.d,minZoom,maxZoom):gesture.s;
 state.scale=next;state.x=x-(gesture.x-gesture.tx)*next/gesture.s;state.y=y-(gesture.y-gesture.ty)*next/gesture.s;transform();
});
function endPointer(e){
 if(!pointers.delete(e.pointerId))return;beginGesture();
 if(!pointers.size){view.classList.remove('drag');swallowClick=didDrag;setTimeout(()=>{swallowClick=false},0)}
}
listen(window,'pointerup',endPointer);listen(window,'pointercancel',endPointer);
view.addEventListener('wheel',e=>{
 e.preventDefault();const r=view.getBoundingClientRect();
 const unit=e.deltaMode===1?16:e.deltaMode===2?view.clientHeight:1;
 if(e.shiftKey){state.auto=false;state.x-=(e.deltaX||e.deltaY)*unit;transform()}
 else zoom(state.scale*Math.exp(-clamp(e.deltaY*unit,-300,300)*.0028),e.clientX-r.left,e.clientY-r.top);
},{passive:false});
listen(document,'keydown',e=>{
 if(e.key==='Escape'){
   if(!$('filters').hidden){e.preventDefault();toggleFilters(false,true);return}
   closeDetail(true);return
 }
 if(state.mode!=='map'||!view.contains(e.target)||e.ctrlKey||e.metaKey||e.altKey)return;
 const move={ArrowLeft:[55,0],ArrowRight:[-55,0],ArrowUp:[0,55],ArrowDown:[0,-55]}[e.key];
 if(move){e.preventDefault();state.auto=false;state.x+=move[0];state.y+=move[1];transform()}
 else if(['+','=','-'].includes(e.key)){e.preventDefault();zoom(state.scale*(e.key==='-'?.8:1.25))}
 else if(e.key.toLowerCase()==='f')fitView();
});
$('app').addEventListener('click',e=>{
 const button=e.target.closest('[data-language]');
 if(!button||button.dataset.language===language)return;
 const next=button.dataset.language;
 try {localStorage.setItem(languageKey,next)} catch {}
 const selectedTab=drawer.querySelector('[role=tab][aria-selected=true]');
 const openFolds=[...drawer.querySelectorAll('details')].map(d=>d.open);
 renderAtlas(next,{
   mode:state.mode, filter:state.filter, selected:state.selected,
   pane:selectedTab?.dataset.pane, openFolds, scroll:$('drawerBody').scrollTop,
   indexScroll:$('indexView').scrollTop, drawerButton:drawer.contains(button),
   camera:state.auto?null:{scale:state.scale,x:state.x,y:state.y}
 });
});
draw();drawFilters();setFilter(saved?.filter||'all');fitView(true);
if(saved){
 setMode(saved.mode);
 if(saved.camera){Object.assign(state,saved.camera,{auto:false});transform()}
 if(saved.selected){
   const mapTrigger=geometry.rects.get(saved.selected)?.el;
   const trigger=saved.mode==='index'?[...$('indexTable').querySelectorAll('[data-card]')].find(el=>el.dataset.card===saved.selected):mapTrigger;
   openDetail(saved.selected,trigger);
   const tab=saved.pane && $('card-tab-'+saved.pane);
   if(tab)showCardTab(tab);
   drawer.querySelectorAll('details').forEach((item,i)=>item.open=!!saved.openFolds[i]);
   $('drawerBody').scrollTop=saved.scroll;
   updateDetailHeader();
 }
 $('indexView').scrollTop=saved.indexScroll;
 const group=saved.drawerButton?drawer.querySelector('.language-switch'):document.querySelector('.topbar .language-switch');
 group.querySelector('[aria-pressed=true]').focus({preventScroll:true});
}
listen(window,'resize',()=>{
 if(state.mode!=='map')return;
 if(needsLayout()){
   const oldWidth=geometry.w, oldHeight=geometry.h;
   const focusedKey=document.activeElement?.dataset.key;
   draw();
   if(!state.auto){
     state.x=state.x*geometry.w/oldWidth;
     state.y=state.y*geometry.h/oldHeight;
     transform();
   }
   if(focusedKey)geometry.rects.get(focusedKey)?.el.focus({preventScroll:true});
 }
 if(state.auto)fitView(true);
 else if(state.selected)keepVisible(state.selected);
});

}
renderAtlas(initialLanguage,null);
