<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><title>Idea Atlas</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2036%2036%22%3E%3Cpath%20fill%3D%22%231c3446%22%20d%3D%22M2%209.6c0-.8.4-1.5%201.2-1.8l9-4.4%2010.6%204.5%208.5-3.7c1-.5%202.2.2%202.2%201.3v21.4c0%20.8-.4%201.4-1.1%201.8l-9.6%204.5-10.6-4.6L4%2032.3c-1%20.5-2-.2-2-1.3Z%22%2F%3E%3Cpath%20fill%3D%22%23436073%22%20d%3D%22M12.2%203.4%2022.8%207.9v25.3l-10.6-4.6Z%22%2F%3E%3Cpath%20fill%3D%22%232d4c60%22%20d%3D%22m22.8%207.9%208.5-3.7c1-.5%202.2.2%202.2%201.3v21.4c0%20.8-.4%201.4-1.1%201.8l-9.6%204.5Z%22%2F%3E%3Cpath%20d%3D%22m5.8%2023.6%206.4-6.4%207.1%202.3%208.3-7.6%22%20fill%3D%22none%22%20stroke%3D%22%23d3eef6%22%20stroke-width%3D%222.45%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3Ccircle%20cx%3D%2227.6%22%20cy%3D%2211.9%22%20r%3D%223.1%22%20fill%3D%22%239ce5f5%22%20stroke%3D%22%232d4c60%22%20stroke-width%3D%221.1%22%2F%3E%3C%2Fsvg%3E">
<style>
*{box-sizing:border-box}
:root { 
  color-scheme:light;
  --ink:#232326; --mute:#616168; --line:#d8d8dc; --paper:#f7f7f8; --sheet:#fff;
  --accent:#0066c6; --accent-light:#eaf3fd; --hover:#ececef; --thread:#a7a7ad;
  --heading:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Consolas,monospace;
 }
html,body{height:100%;margin:0;color:var(--ink);font:14px/1.5 var(--heading);-webkit-font-smoothing:antialiased}
body{background:var(--paper)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
button:disabled{opacity:.4;cursor:default}
[hidden]{display:none!important}
svg.icon{width:18px;height:18px;vertical-align:middle;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{height:100%;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.topbar,.foot{flex:none;position:relative;z-index:2}

.topbar{display:flex;align-items:center;gap:14px;height:57px;padding-inline:clamp(16px,3vw,48px);z-index:5;background:#fff;border-bottom:1px solid #e5e5e8}
.brand{display:flex;align-items:center;gap:9px;white-space:nowrap;color:#353538;font-weight:640;font-size:15px;letter-spacing:.01em}
.atlas-mark{width:32px;height:32px;display:block;flex:none}
.mode-switch{display:flex;align-items:center;gap:1px;margin-left:auto;padding:3px;border-radius:9px;background:#ededf0}
.mode-switch button{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;min-height:28px;border:0;border-radius:6px;background:transparent;font-size:12px;font-weight:570;color:#55565b}
.mode-switch i,.filter-trigger i{display:inline-flex}
.mode-switch svg.icon,.filter-trigger svg.icon{height:15px;width:15px}
.mode-switch button[aria-pressed=true]{color:#202124;background:#fff;box-shadow:0 1px 4px #1e1f291a}
.mode-switch button:not([aria-pressed=true]):hover,.filter-trigger:hover{background:#e4e4e8}
.filter-host{position:relative;padding-left:12px;border-left:1px solid var(--line)}
.filter-trigger{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:34px;padding:4px 10px;font-size:13px;font-weight:540;border:0;border-radius:8px;color:#515258;background:transparent}
.filter-trigger[aria-expanded=true]{background:var(--hover)}
.filter-trigger.has-filter{color:var(--accent);background:var(--accent-light)}
#filterTotal{font-variant-numeric:tabular-nums;font-size:11px}
.filter-list{position:absolute;right:0;top:calc(100% + 9px);min-width:203px;padding:6px;display:grid;border:1px solid var(--line);border-radius:13px;background:var(--sheet);box-shadow:0 10px 32px #10131a1c,0 2px 6px #10131a0b}
.filter{display:flex;align-items:center;gap:7px;padding:7px 10px;min-height:34px;border:0;border-radius:7px;text-align:left;background:transparent;color:var(--ink);font-size:13px}
.filter:hover{background:var(--hover)}
.filter[aria-pressed=true]{font-weight:620;background:var(--accent-light);color:var(--accent)}
.count{margin-left:auto;font-size:12px;font-variant-numeric:tabular-nums}
.filter-sep{height:1px;margin:5px 9px;background:var(--line)}
.divider{width:1px;height:14px;flex:none;background:var(--line);margin:0 5px}
.statusmark{display:inline-block;width:7px;height:7px;flex:none}
.live{color:var(--mute)}
.mark-live{border-radius:50%;background:#34815c}
.needs-evidence{color:var(--mute)}
.mark-needs-evidence{border:1.65px solid #93702f;transform:rotate(45deg);border-radius:1px}
.killed{color:var(--mute)}
.mark-killed{position:relative;width:8px;height:8px}
.mark-killed:before,.mark-killed:after{content:"";position:absolute;top:3px;left:0;width:8px;height:1.6px;background:#73737a;transform:rotate(45deg)}
.mark-killed:after{transform:rotate(-45deg)}
.mark-variant,.mark-seed,.mark-duplicate{border:1.5px solid #73737a;border-radius:2px}
.surface{flex:1;min-height:0;display:flex;position:relative}
.main{flex:1;min-width:0;position:relative}
.mapview { position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab;background:var(--paper) }
.mapview:focus-visible{outline-offset:-4px}
.mapview.drag{cursor:grabbing;user-select:none}
.world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.wires{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}

/* The overview has three levels: a document title, section headings, and grouped rows. */
.wire,.active-edge {
  fill:none; stroke:#c5c7cb; stroke-width:1; stroke-linecap:round; stroke-linejoin:round;
  vector-effect:non-scaling-stroke;
}
.active-edge { stroke:#6995bf; stroke-width:1.5 }
.wire.dim { opacity:.38 }
#groups { position:absolute; inset:0; pointer-events:none }
.group-surface {
  position:absolute; border-radius:16px; background:var(--sheet);
  box-shadow:0 1px 3px #161b2710, 0 0 0 1px #161b2709;
}
.node {
  position:absolute; appearance:none; border:0; background:transparent;
  min-width:0; padding:0; text-align:left; cursor:pointer; user-select:none;
  color:var(--ink); overflow-wrap:anywhere;
}
.node:focus-visible { z-index:1; outline-width:2px; outline-offset:2px }
.node.dim { opacity:.38 }
.root-node,.lens-node { display:flex; flex-direction:column; align-items:flex-start; border-radius:6px }
.root-meta,.lens-meta,.idea-title,.badge { display:flex; align-items:center }
.root-node strong {
  order:0; font-size:39px; line-height:1.19; font-weight:730; letter-spacing:-.035em; text-wrap:balance;
}
.root-meta { order:1; gap:10px; margin-top:12px; font-size:13px; font-weight:500; color:var(--mute) }
.lens-node { padding:0 4px; gap:7px }
.lens-meta { width:100%; gap:9px; align-items:baseline }
.lens-meta strong { font-size:23px; line-height:1.3; font-weight:680; letter-spacing:-.025em }
.lens-letter { flex:none; white-space:nowrap; font:500 11px/1.4 var(--mono); color:var(--mute) }
.lens-text { color:#575b62; line-height:1.48; font-size:14px; padding-right:8px }
.root-node:hover strong,.lens-node:hover strong { color:#333d50 }
.idea-node {
  display:flex; flex-direction:column; justify-content:center; gap:4px;
  padding:14px 16px; border-radius:0;
}
.idea-node.first { border-radius:16px 16px 0 0 }
.idea-node.last { border-radius:0 0 16px 16px }
.idea-node.first.last { border-radius:16px }
.idea-node:not(.first)::before {
  content:""; position:absolute; left:16px; right:16px; top:0; height:1px; background:#e7e7ea;
}
.idea-title { width:100%; justify-content:space-between; align-items:baseline; gap:10px }
.idea-title strong { font-size:17px; font-weight:610; line-height:1.38 }
.idea-node .micro { font-size:13px; line-height:1.55; color:#676970 }
.badge { display:inline-flex; flex:none; gap:5px; white-space:nowrap; color:var(--mute); font:12px/1.45 var(--heading) }
.idea-node .badge { font-size:11px }
.idea-node:hover { background:#f0f2f5 }
.idea-node.selected { background:#e7f0fc }
.lens-node.selected strong,.root-node.selected strong { color:#185588 }
.idea-node.killed-card .idea-title strong { color:#686970 }
@media(prefers-contrast:more) {
  .wire { stroke:#81838a }
  .active-edge { stroke:#225e97; stroke-width:2 }
  .idea-node:not(.first)::before { background:#a0a0a4 }
  .node.dim { opacity:1; outline:1px dashed #78797d; outline-offset:-2px }
}
.foot{height:42px;padding:0 clamp(14px,2.1vw,34px);gap:14px;background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;color:var(--mute);font-size:12px}
.zoom-tools{display:flex;align-items:center;gap:2px}
.tool{background:transparent;border:0;display:inline-flex;align-items:center;justify-content:center;gap:5px;border-radius:5px;height:30px;min-width:30px;padding:3px 6px;color:var(--ink);font-size:12px}
.tool:hover{background:var(--hover)}
.tool.percent{font:12px var(--mono);min-width:45px}
.foot-end{margin-left:auto;white-space:nowrap;font-variant-numeric:tabular-nums}
.keyhint{font-size:11.5px}

@media(max-width:820px){
  .topbar{height:52px;gap:9px}
  .foot{gap:8px}.keyhint{display:none}
}
@media(max-width:650px){
  .topbar{height:52px;padding:0 12px}.filter-host{padding-left:6px}.atlas-mark{width:29px;height:29px}.filter-trigger{padding:4px 6px}.filter{min-height:42px}
  .brand{font-size:16px;font-weight:620;color:var(--ink)}
  .mode-switch button{font-size:12px;padding:5px 8px;gap:5px}
  
  .root-node strong{font-size:30px}.lens-meta strong{font-size:21px}.foot{padding:0 9px;height:38px}.foot-end{font-size:11px}
}

.index-view {
  height:100%; overflow:auto; container-type:inline-size; background:#fff;
  padding:24px clamp(16px,4vw,62px) 40px; color:var(--ink);
}
.index-heading, #indexTable { max-width:1360px; margin-inline:auto }
.index-heading { display:flex; align-items:baseline; gap:12px; margin-bottom:18px }
.index-heading h2 { font:720 23px/1.35 var(--heading); letter-spacing:-.025em; margin:0 }
.index-heading span { color:var(--mute); font-size:13px; font-variant-numeric:tabular-nums }
.pa-index { font-size:14px; line-height:1.55; overflow-wrap:anywhere }
.pa-index table { width:100%; border-collapse:separate; border-spacing:0; text-align:left }
.pa-index th,.pa-index td { vertical-align:middle; padding:13px 12px; border:0; border-bottom:1px solid var(--line) }
.pa-index thead th {
  position:sticky; top:-24px; z-index:1; background:var(--paper);
  font-weight:620; color:var(--mute); font-size:12px; padding-block:8px;
}
.pa-index thead th:first-child { border-radius:6px 0 0 0 }
.pa-index thead th:last-child { border-radius:0 6px 0 0 }
.pa-index tbody th { width:29%; font-weight:inherit }
.pa-index .pa-branchcol { width:18% }
.pa-index tbody td:last-child { width:1%; white-space:nowrap }
.pa-indexopen,.pa-cardlink { color:inherit; font:inherit; text-align:left; cursor:pointer }
.pa-indexopen {
  display:flex; align-items:baseline; gap:10px; padding:5px 2px; border:none; background:transparent;
  width:100%; border-radius:3px;
}
.pa-indexopen strong { font-size:15px; line-height:1.45; font-weight:680 }
.pa-id { font:600 11.5px/1.6 var(--mono); color:var(--mute) }
.pa-indexopen .pa-id,.pa-cardlink .pa-id {
  flex:none; font-variant-numeric:tabular-nums; color:var(--mute);
  background:var(--hover); border-radius:4px; padding:1px 5px;
}
.pa-index tr:focus-within,.pa-index tbody tr:hover,.pa-index tbody tr:has([aria-current="true"]) { background:var(--paper) }
.pa-indexopen:hover strong,.pa-indexopen[aria-current="true"] strong { color:var(--accent) }
.pa-branchname { display:inline-flex; align-items:baseline; gap:6px; font-weight:600; font-size:13px }

.pa-indexscene,.pa-cardlink small { display:block; color:var(--mute); line-height:1.5; font-size:12px; font-weight:400 }
.pa-indexscene:not(:empty) { margin-block:2px }
.pa-index .badge,.drawer .badge { font-size:12px }
.pa-empty { padding:24px 0; color:var(--mute); border-top:1px solid var(--line) }
@container (max-width:560px) {
  .pa-index table,.pa-index tbody { display:block }
  .pa-index thead { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%) }
  .pa-index tbody tr { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:3px 10px; padding:14px 2px; border-bottom:1px solid var(--line) }
  .pa-index tbody th,.pa-index tbody td,.pa-index .pa-branchcol,.pa-index tbody td:last-child { border:0; min-width:0; width:auto; padding:0 }
  .pa-index tbody th { grid-area:1/1 }
  .pa-index tbody .pa-branchcol { grid-area:2/1 /3/-1; padding-block:0 3px }
  .pa-index tbody td:nth-child(3) { grid-area:3/1 /4/-1; font-size:14px }
  .pa-index tbody td:last-child { grid-area:1/2; align-self:center }
  .pa-indexopen { gap:6px }
  .pa-branchname { font-size:12px }
}
.drawer {
  width:clamp(345px,31vw,465px); min-height:0; flex:none; display:flex; flex-direction:column;
  z-index:3; background:#fff; color:var(--ink); border-left:1px solid var(--line);
}
.drawer-head {
  flex:none; padding:14px 23px 17px; border-bottom:1px solid var(--line);
  background:var(--sheet); position:relative; overflow-wrap:anywhere;
}

.drawer-top { display:flex; align-items:center; justify-content:space-between; gap:10px }
.drawer-k { font-size:12px; color:var(--mute); line-height:1.5 }

.drawer-head h2 { font:680 30px/1.3 var(--heading);margin:13px 0 2px;letter-spacing:-.025em }
.close-btn { display:grid;place-items:center;flex:none;width:32px;height:32px;border:0;border-radius:50%;color:var(--mute);background:var(--hover) }
.close-btn:hover { background:var(--line) }
.drawer-body { flex:auto; min-height:0; padding:17px 23px 36px; overflow:auto; overscroll-behavior:contain }
.pa-detail { font-size:14px; line-height:1.65; overflow-wrap:anywhere }
.pa-muted { color:var(--mute); font-size:13px; margin:8px 0 14px }
.pa-question { font-size:16px; font-weight:620; line-height:1.65; margin:12px 0 18px; color:var(--ink) }
.pa-section + .pa-section,.pa-fields + .pa-section { margin-top:24px }
.pa-detail h3 { display:flex;align-items:center;gap:8px;margin:0;padding-block:6px;border-bottom:1px solid var(--line);font:660 15px/1.5 var(--heading);color:var(--ink) }
.pa-detail h3 .pa-id { color:var(--mute); font-size:11px }
.pa-fields { width:100%; border-collapse:collapse; text-align:left; table-layout:fixed }
.pa-fields th,.pa-fields td { padding:8px 0; border-bottom:1px solid var(--line); vertical-align:top }
.pa-fields th { width:6.4em; padding-right:12px; font-size:12px; font-weight:520; color:var(--mute) }
.pa-fields td { line-height:1.65 }

.pa-links { display:grid }
.pa-cardlink {
  display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:baseline; gap:9px; width:100%;
  border:0; border-bottom:1px solid var(--line); background:transparent; padding:12px 2px;
}
.pa-cardlink:hover { background:var(--paper) }
.pa-cardlink strong { display:block; font-weight:640 }
.pa-cardlink small { margin-top:2px }
.pa-open-icon { color:var(--mute); font-size:14px }
@media(max-width:820px) { .drawer { width:330px } }
@media(max-width:650px) {
  .index-view { padding:16px 14px 28px }
  .index-heading { margin-bottom:8px }
  .index-heading h2 { font-size:20px }
  .drawer { position:absolute; inset:0 0 0 auto; width:min(100%,415px); box-shadow:-6px 0 18px #00000010 }
  .drawer-head { padding:12px 16px }
  .drawer-head h2 { font-size:26px }
  .filter-host .filter-list{max-width:calc(100vw - 24px);max-height:calc(100dvh - 70px);overflow:auto}

  .drawer-body { padding:15px 16px 32px }
  .close-btn { width:38px; height:38px }
}
/* The card reader has its own scrolling document. The map and branch inspectors stay independent. */
.drawer.card-open {
  --reader-pad:clamp(24px,2.65vw,42px);
  --reader-line:#e6e6e9;
  --reader-muted:#64656b;
  --reader-ink:#222326;
  width:clamp(430px,39vw,584px);
  background:#fff; color:var(--reader-ink); border-left:1px solid #dbdbdf;
}
.card-open .drawer-head { padding:9px var(--reader-pad) 7px; border:0; background:#fff; }
.card-open .drawer-top { min-height:32px; }
.card-open #drawerPath {
  display:flex; align-items:center; flex-wrap:nowrap; gap:7px; min-width:0;
  line-height:1.35; font-size:12.5px; color:var(--reader-muted);
}
.card-open .crumb-link {
  appearance:none; border:0; padding:5px 0; background:none; color:inherit; font:inherit;
  min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.card-open .crumb-link:hover { text-decoration:underline; text-underline-offset:3px; }
.card-open .crumb-sep { color:#93949b; }
.card-open .card-code { flex:none; letter-spacing:.03em; font-variant-numeric:tabular-nums; }
.card-open .compact-title { display:none; }
.card-open.scrolled .compact-title {
  display:inline; overflow:hidden; white-space:nowrap; text-overflow:ellipsis;
  color:var(--reader-ink); font-weight:620;
}
.card-open .close-btn { width:30px; height:30px; background:#f1f1f3; }
.card-open .close-btn:hover { background:#e7e7ea; }
.card-open .close-btn .icon { width:15px; height:15px; }
.card-open .drawer-body {
  padding:0; min-width:0; scrollbar-gutter:stable; scroll-padding-top:52px;
  overflow-x:hidden; overflow-y:auto; overflow-wrap:anywhere;
}
.card-open .card-hero { padding:12px var(--reader-pad) 18px; }
.card-open #drawerTitle {
  font:720 clamp(30px,2.5vw,37px)/1.2 var(--heading);
  margin:0; letter-spacing:-.025em; text-wrap:balance;
}
.card-open .card-promise { margin:7px 0 0; font-size:17px; line-height:1.5; color:#505158; }
.card-open .card-meta {
  display:flex; align-items:center; flex-wrap:wrap; gap:5px 12px;
  font-size:12px; color:var(--reader-muted); margin-top:13px;
}
.card-open .card-meta .badge { font-size:12px; }
.card-open .card-tabs {
  position:sticky; top:0; z-index:2; display:flex; align-items:stretch; gap:clamp(16px,2.5vw,30px);
  padding:0 var(--reader-pad); background:#fff; box-shadow:inset 0 -1px var(--reader-line);
}
.card-open .card-tabs button {
  position:relative; min-height:44px; display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
  padding:4px 1px; border:0; background:transparent; font-size:14px; color:var(--reader-muted); font-weight:550;
}
.card-open .card-tabs button[aria-selected="true"] { color:var(--reader-ink); font-weight:680; }
.card-open .card-tabs button[aria-selected="true"]::after {
  content:""; position:absolute; inset:auto 0 0; height:2px; background:currentColor; border-radius:2px;
}
.card-open .tab-count { font-size:11px; color:var(--reader-muted); font-variant-numeric:tabular-nums; }
.card-open .card-pane { padding:24px var(--reader-pad) 42px; font-size:15px; line-height:1.7; }
.card-open .reading-section,.card-open .decision-summary,.card-open .reading-context { margin:0 0 24px; }
.card-open .reading-section h3 {
  margin:0 0 8px; color:var(--reader-muted); font-size:12.5px; line-height:1.45; font-weight:620;
}
.card-open .reading-section p,.card-open .fold-body p { margin:5px 0 0; }
.card-open .reading-section .reading-headline,.card-open .reading-lead {
  margin:0 0 7px; color:var(--reader-ink); font-weight:640; font-size:19px; line-height:1.5; letter-spacing:-.015em;
}
.card-open .reading-section p:not(.reading-headline),.card-open .fold-body { color:#45464b; }
.card-open .reading-context {
  padding:15px 18px; border-radius:12px; background:#f5f5f7;
}
.card-open .context-main { margin:0; color:var(--reader-ink); font-size:15px; font-weight:610; }
.card-open .context-time { font-size:13px; color:var(--reader-muted); }
.card-open .reading-context p { margin:6px 0 0; }
.card-open .reading-fields,.card-open .measure-list { margin:0; }
.card-open .reading-fields > div,.card-open .measure-list > div {
  display:grid; grid-template-columns:minmax(4em,5em) minmax(0,1fr); column-gap:16px; padding:8px 0;
}

<script type="application/json" id="atlasData">{"project":{"title":"A Second Cooking Station at the Dining Room Sideboard","subtitle":"Move one light meal-prep routine into the dining room without building a second kitchen."},"readings":{"R1":{"name":"Moving one routine","q":"Which part of the kitchen routine could take place entirely at the sideboard?","premise":"A second cooking station takes the most self-contained part of a longer routine, such as making breakfast, brewing drinks, plating dishes or packing lunch, and moves it into the dining room.","audience":"Households that often make breakfast, pack lunch or entertain, and whose kitchens get crowded in the morning.","check":"For one week, count trips between kitchen and dining table. Ask which task people would most like to finish without going back to the kitchen."},"R2":{"name":"A shared counter","q":"The sideboard sits in a shared room. Whose counter is it?","premise":"Children, older adults, guests and people working from home all use the sideboard. Unlike a personal kitchen workspace, it has no obvious owner when it comes to cleaning up.","audience":"People who share their dining room with family or guests.","check":"Observe for one week who stands at the sideboard most often and who cleans up at the end."},"R3":{"name":"Prep without plumbing","q":"Without a water supply or drain, which prep tasks are still worth moving?","premise":"The sideboard cannot be plumbed in. Washing, chopping, draining and collecting scraps each need a module that works without running water, or that task must be left out.","audience":"Households in rentals or finished homes where the plumbing cannot be changed.","check":"Use two buckets and a colander at the sideboard to prep a meal for two. Record time spent changing water and cleaning up."},"R4":{"name":"How much heat fits?","q":"Without an extractor, which kinds of hot food can leave the kitchen?","premise":"The sideboard can accommodate induction cooking, keeping food warm and assembling meals. Stir-frying and deep-frying are out. Steam needs somewhere to go, or the cabinet will be the first thing to fail.","audience":"People who want hot pot or hot dishes in the dining room without cooking fumes.","check":"Cook hot pot once on a portable induction hob at the dining table. Check steam and odors, and measure the outlet and countertop temperatures."}},"cards":{"A01":{"id":"A01","reading":"R1","title":"Breakfast Station","family":"morning launch","status":"live","promise":"Breakfast without crossing the kitchen","role":"Dual-income households or families with school-age children","occasion":"Weekdays, 7:00–7:30","freq":"5 days a week","current":"The toaster, kettle and dishes are all in the kitchen, so breakfast gets carried back and forth.","relationship":"Partners and children leaving home at the same time in the morning","sub":"The kitchen counter and dining table cost nothing extra but get crowded.","gap":"There is only one stretch of counter in the morning rush, and backpacks or laptops take up the dining table.","mechanism":"A 40 cm counter holds the toaster, kettle and dishes, with a removable crumb tray and a flip-up outlet.","action":"Give the three breakfast essentials a permanent place on the sideboard.","how":"Set up the night before, press the buttons in the morning and carry the tray straight to the table.","proof":"Proposed targets: finish within 5 minutes, use it ≥4 times a week and occupy ≤60 cm of counter.","tradeoff":"Crumbs, steam and counter space","kill":"Within 2 weeks, 3 of 5 households return to making breakfast in the kitchen, or the counter needs wiping \u003e2 times a day.","insight":"The first use that justifies a second cooking station may be getting breakfast out of the morning kitchen rush.","evidence":"yellow","evidenceNotes":"U1: The user supplied the topic without a household sample. Morning congestion is a hypothesis to check by observing 5 households.","statusReason":"The setup makes sense. How often people need it remains untested.","short":{"rank":1,"why":"Most frequent use, very little grease and the best fit for a 40 cm counter","risk":"Crumbs, steam and cleanup","test":"Breakfast logs from 5 households over 2 weeks"},"claim":"In dual-income households or families with school-age children, breakfast moves back and forth between the kitchen and the table on weekdays from 7:00 to 7:30. The toaster, kettle and dishes share one crowded counter, and backpacks or laptops occupy the dining table. Those surfaces cost nothing extra. A 40 cm counter with the three essentials, a removable crumb tray and a flip-up outlet promises “breakfast without crossing the kitchen.” The proposed targets are 5 minutes or less, ≥4 uses a week and ≤60 cm of counter space. Crumbs, steam and the space it takes are the tradeoffs."},"A02":{"id":"A02","reading":"R1","title":"Coffee with Guests","family":"coffee host","status":"live","promise":"Guests needn’t wait for the host","role":"Coffee or tea drinkers who often entertain at home","occasion":"Weekend afternoons or when friends visit","freq":"2–4 times a week","current":"The coffee machine is in the kitchen, so the host keeps leaving the room when guests arrive.","relationship":"Host and guests, across the living and dining rooms","sub":"The kitchen coffee machine and a tray cost nothing extra but interrupt the visit.","gap":"The host leaves the living room, and guests wait 5–10 minutes for the first cup.","mechanism":"A 45 cm counter with a coffee machine, kettle, cups and a small covered water tank needs no plumbing.","action":"Make drinks within sight of the guests.","how":"Guests sit down, the host turns to the station and the first cup is ready in 3 minutes.","proof":"Proposed targets: 4 cups in 3 minutes, ≥2 uses a week and ≤1 trip away from the table for the host.","tradeoff":"Water tank, cleaning and counter space","kill":"Within 2 weeks, the tank grows mold, it needs cleaning \u003e2 times a week, or guests prefer going to the kitchen.","insight":"The most costly part of serving coffee may be the 5 minutes the host spends away from the guests.","evidence":"yellow","evidenceNotes":"U1: The user gave no hosting frequency. The tank and its cleaning needs are assumptions to test at one afternoon tea for 6.","statusReason":"The occasion makes sense. Cleaning and water handling remain untested.","short":{"rank":2,"why":"Guests can see it in use, it produces little grease and it is easy to demonstrate","risk":"Mold in the tank and the work of cleaning it","test":"Time one afternoon tea for 6 and record the cleanup"},"claim":"For coffee or tea drinkers entertaining friends on a weekend afternoon, the kitchen machine and a tray are a free option. But the host goes in and out and guests wait 5–10 minutes for the first cup. A 45 cm counter with a coffee machine, kettle, cups and a small covered tank keeps the host in the room without adding plumbing. Guests needn’t wait for the host. Proposed targets are 4 cups in 3 minutes, ≥2 uses a week and ≤1 trip away from the table. The tank takes counter space and needs cleaning."},"A03":{"id":"A03","reading":"R1","title":"Plating Station","family":"plating pass","status":"needs-evidence","promise":"No turning back in the last meter","role":"People who often cook several dishes and host meals at home","occasion":"The 30 minutes before dinner","freq":"2–3 times a week","current":"Dishes are plated in the kitchen and carried to the dining table.","relationship":"Host and guests","sub":"The kitchen counter and dining table cost nothing extra but require trips back and forth.","gap":"The sideboard has no heat-resistant surface large enough for plating.","mechanism":"A 90 cm-high, heat-resistant counter with a tray, warming lamp and concealed waste opening","action":"Move final plating to the sideboard.","how":"Bring cooked food out of the kitchen, plate it at the sideboard and serve it straight away.","proof":"Proposed targets: save 2 trips, provide a surface ≥100 × 40 cm and leave the finish undamaged by hot plates.","tradeoff":"Heat resistance, depth and cleaning","kill":"Within 2 weeks, hot plates leave scorch marks or the counter cannot hold two serving dishes.","insight":"The sideboard may have a role in the last meter between kitchen and table.","evidence":"grey","evidenceNotes":"U1: The user gave no hosting frequency. Heat resistance and dimensions are assumptions to check with a cardboard mock-up and a hot-plate test.","statusReason":"The occasion makes sense. The materials remain untested.","short":{"rank":6,"why":"Places the second station directly on the route from kitchen to table","risk":"Heat resistance and dimensions","test":"Test a cardboard mock-up and hot plates for 2 weeks"},"claim":"For people who cook several dishes when hosting at home, the last 30 minutes before dinner involve plating in the kitchen and carrying dishes to the table. Both surfaces are free to use, but the trips add up and the sideboard lacks a large heat-resistant plating area. A 90 cm-high heat-resistant counter with a tray, warming lamp and concealed waste opening promises no turning back in the last meter. The aim is to save 2 trips, provide ≥100 × 40 cm of surface and keep hot plates from marking the finish. Heat resistance, depth and cleaning are the tradeoffs."},"A04":{"id":"A04","reading":"R1","title":"Breakfast Drawer","family":"breakfast drawer","status":"needs-evidence","promise":"Pull it open for breakfast","role":"People who want to skip laying out the counter in the morning","occasion":"Weekday mornings","freq":"5 days a week","current":"Bowls, cereal and jam are scattered across kitchen cupboards.","relationship":"The person making breakfast and their children","sub":"Kitchen cabinets and the dining table are free to use, but breakfast supplies are spread out.","gap":"The same items have to be taken out and put away every day, and the counter still fills up.","mechanism":"A 40 cm pull-out drawer holds bowls, cereal, jam and spoons in one layer, with small appliances above.","action":"Keep all the breakfast supplies in one drawer.","how":"Pull it out, take a bowl, prepare the cereal and push it back in.","proof":"Proposed targets: gather everything in 30 seconds and use the drawer ≥4 times a day.","tradeoff":"Load capacity, moisture resistance and price","kill":"Within 2 weeks, the drawer runners bend or the food gets damp.","insight":"Part of the work of breakfast is getting the same things out and putting them back every day.","evidence":"grey","evidenceNotes":"U1: The user supplied no observations of storage habits. The runners and moisture resistance are assumptions to test with 1 prototype drawer.","statusReason":"The construction is simple. Actual use remains untested.","short":null,"claim":"For people who want to skip setting up a counter on weekday mornings, bowls, cereal and jam are currently scattered through the kitchen. The cabinets and dining table are free to use but mean repeatedly taking things out, putting them back and occupying counter space. A 40 cm pull-out drawer groups bowls, cereal, jam and spoons below the small appliances: pull it open for breakfast. The proposed targets are to gather everything in 30 seconds and use the drawer ≥4 times a day. Load capacity, moisture resistance and price are the tradeoffs."},"A05":{"id":"A05","reading":"R1","title":"Lunchbox Packing Station","family":"lunch assembly","status":"needs-evidence","promise":"Pack lunch in 3 minutes in the morning","role":"People who take lunch to work or school","occasion":"Weekdays, 7:00–7:30","freq":"5 days a week","current":"Lunchboxes are packed on the kitchen counter, competing with breakfast for space.","relationship":"The person packing lunch and their children","sub":"The kitchen counter and dining table cost nothing extra but get crowded.","gap":"Lunchboxes, side dishes and cutlery are scattered around, and everything needs putting away afterward.","mechanism":"A 40 cm counter with a drawer for lunchboxes and side dishes, a small chopping board and a bin","action":"Give lunch packing a fixed sequence in one place.","how":"Prep the ingredients the night before, pack in order in the morning and get lids and bags from one spot.","proof":"Proposed targets: pack in 3 minutes and use the station ≥4 times a week.","tradeoff":"Cleaning, counter space and distance from the fridge","kill":"Within 2 weeks, fetching ingredients takes \u003e3 trips to the fridge per day, or the counter is too small.","insight":"Packing a lunchbox is one of the easiest high-frequency tasks to overlook in a second cooking station.","evidence":"grey","evidenceNotes":"U1: The user gave no lunch-packing habits. The proposed route needs logs from 5 people over 2 weeks.","statusReason":"The occasion makes sense. Frequency remains untested.","short":null,"claim":"For people taking lunch to work or school, packing it on weekdays between 7:00 and 7:30 competes with breakfast. The kitchen counter and dining table cost nothing extra but get crowded. Lunchboxes, side dishes and cutlery are scattered, and everything has to be put away afterward. A 40 cm counter with a dedicated drawer, small chopping board and bin promises a packed lunch in 3 minutes. The proposed targets are 3 minutes and ≥4 uses a week. Cleaning, counter space and trips to the fridge are the tradeoffs."},"B01":{"id":"B01","reading":"R2","title":"A Counter Kids Can Reach","family":"kid self-serve","status":"live","promise":"Kids can help themselves without calling for Mom","role":"Families with children aged 4–10","occasion":"After school or at weekend breakfast","freq":"4–5 times a week","current":"The kitchen counter is out of reach, so parents fetch things for the children.","relationship":"Children and parents","sub":"The high kitchen counter plus a parent's help costs nothing extra but leaves children dependent on adults.","gap":"The sideboard is a better height for children but has no safe, easy-to-reach section.","mechanism":"Below a 90 cm counter, store cups, fruit and cutlery. Use tip-resistant cups, rounded corners and a lockable upper cabinet.","action":"Put the children's supplies at their height.","how":"Children help themselves to cups and fruit. Parents only restock.","proof":"Proposed targets: children help themselves ≥4 times a week, with no burns or spills.","tradeoff":"Safety, storage and appearance","kill":"Within 2 weeks, there are \u003e2 spills or the children still go straight to a parent for help.","insight":"Children are the first test of a shared sideboard: can they reach what they need and put it away themselves?","evidence":"yellow","evidenceNotes":"U1: The user gave no children's ages. The safe reach height is an assumption to check by observing 3 families.","statusReason":"The occasion makes sense. Safety remains untested.","short":{"rank":4,"why":"The clearest change in how people use a shared counter","risk":"Safety and spills","test":"Observe 3 households for 2 weeks"},"claim":"For families with children aged 4–10, after-school snacks and weekend breakfasts often depend on a parent fetching things from a high kitchen counter. That costs nothing extra, but children cannot help themselves. The sideboard is a better height and lacks a safe, accessible section. A lower shelf below a 90 cm counter puts cups, fruit and cutlery within reach, with tip-resistant cups, rounded corners and locked upper storage. Children can help themselves without calling for Mom. The target is ≥4 independent uses a week with no burns or spills. Safety, storage and appearance are the tradeoffs."},"B02":{"id":"B02","reading":"R2","title":"Meal Station for Older Adults","family":"elderly plating","status":"needs-evidence","promise":"Walk less and get a meal sooner","role":"Households living with an older adult who needs separate portions or soft food","occasion":"Lunch or dinner","freq":"Every day","current":"The older person waits in the kitchen for hot food, which is then carried to their room.","relationship":"Older adult and caregiver","sub":"The kitchen and microwave cost nothing extra but involve a long walk.","gap":"Walking takes time, with a risk of burns and a wait for food.","mechanism":"A warming drawer, plate for soft food and one-touch reheating, with an 85 cm-high counter","action":"Let the older person sit down first.","how":"Collect the meal at the sideboard, keep it warm and carry it to the table.","proof":"Proposed targets: serve in 5 minutes, keep it safe to handle and use the station ≥5 times a week.","tradeoff":"Safety, cleaning and capacity","kill":"Within 2 weeks, there is a burn or spill, or the older person is unwilling to use the station.","insight":"What the older person needs from a second cooking station is a meal without the walk or the wait.","evidence":"grey","evidenceNotes":"U1: The user's brief gave no information on the older adult's condition. Safety is an assumption to check in 1 household over 2 weeks.","statusReason":"The occasion makes sense. Safety remains untested.","short":null,"claim":"For households preparing separate portions or soft food for an older adult at lunch or dinner, the older person waits for hot food in the kitchen and the meal is carried to their room. The kitchen and microwave cost nothing extra, but the long walk, wait and risk of burns remain. An 85 cm-high counter with a warming drawer, soft-food plate and one-touch reheating promises less walking and a meal sooner. Proposed targets are service in 5 minutes, safe handling and ≥5 uses a week. Safety, cleaning and capacity are the tradeoffs."},"B03":{"id":"B03","reading":"R2","title":"Self-Service Buffet","family":"guest buffet","status":"needs-evidence","promise":"Guests can stay out of the kitchen","role":"People who often host parties or meals at home","occasion":"Weekend gatherings lasting 2–3 hours","freq":"1–2 times a month","current":"Food stays in the kitchen. Guests hesitate to enter, so the host carries it back and forth.","relationship":"Host and guests","sub":"The kitchen and dining table cost nothing extra, but serving everyone wears out the host.","gap":"Guests cannot tell where to help themselves, so the host serves the whole room.","mechanism":"A one-way buffet on the sideboard with plates, tongs, drinks and a waste opening","action":"Set the buffet up on the sideboard.","how":"Guests queue and help themselves. The host only refills the food, and the waste opening stays concealed.","proof":"Proposed targets: the host refills food ≤2 times, and guests serve themselves ≥80% of the time.","tradeoff":"Keeping food warm, counter space and cleaning","kill":"Within 2 weeks, guests still go to the kitchen or the counter cannot hold enough for 6 people.","insight":"While entertaining, the sideboard can serve as a buffer that lets guests stay out of the kitchen.","evidence":"grey","evidenceNotes":"U1: The user gave no hosting frequency. The buffet route is a hypothesis to test at 1 gathering for 8.","statusReason":"The occasion makes sense. Capacity remains untested.","short":null,"claim":"For people hosting friends at home for 2–3 hours on a weekend, food normally stays in the kitchen. Guests hesitate to go in, so the host carries food back and forth. The kitchen and table cost nothing extra but leave the host serving everyone, because guests cannot tell where to help themselves. A one-way sideboard buffet with plates, tongs, drinks and a waste opening lets guests stay out of the kitchen. The proposed targets are ≤2 refills for the host and ≥80% self-service. Keeping food warm, taking up counter space and cleaning are the tradeoffs."},"B04":{"id":"B04","reading":"R2","title":"Work-from-Home Lunch","family":"wfh lunch","status":"needs-evidence","promise":"No queue at noon","role":"People working from home with a short lunch break","occasion":"Weekdays, 12:00–12:30","freq":"5 days a week","current":"They cook in the kitchen or order delivery, competing with household chores for counter space.","relationship":"The person working from home and their family","sub":"The kitchen or delivery. The existing setup costs nothing extra but interrupts work.","gap":"The break is short, the kitchen is far away, and smells and noise can interfere.","mechanism":"A kettle, sandwich maker and dishes on the sideboard make up a 5-minute lunch station.","action":"Put lunch beside the workspace.","how":"Press the button at 11:55, eat at 12:00 and return to the desk at 12:15.","proof":"Proposed targets: 5 minutes, ≥4 uses a week and a clean workspace.","tradeoff":"Odors, noise and counter space","kill":"Within 2 weeks, fumes from the sandwich maker prompt family complaints or the person still orders delivery \u003e3 times a week.","insight":"For someone working from home, a second cooking station could save one round trip to the kitchen.","evidence":"grey","evidenceNotes":"U1: The user gave no proportion of people working from home. Odor is an assumption to test with 5 people over 2 weeks.","statusReason":"The occasion makes sense. Odor remains untested.","short":null,"claim":"For people working from home with a short weekday break from 12:00 to 12:30, using the kitchen or ordering delivery interrupts work, and cooking competes with chores for counter space. The existing setup costs nothing extra, but the kitchen is far away and smells and noise can interfere. A sideboard holding a kettle, sandwich maker and dishes offers a 5-minute lunch with no queue at noon. Proposed targets are 5 minutes, ≥4 uses a week and a clean workspace. Odors, noise and the counter space it takes are the tradeoffs."},"B05":{"id":"B05","reading":"R2","title":"Shared Cleanup Station","family":"cleanup caddy","status":"needs-evidence","promise":"The last person to eat clears up","role":"Households that share a dining room and argue about cleaning up","occasion":"The 10 minutes after dinner","freq":"Every day","current":"Dishes pile up in the sink or on the dining table, and no one claims them.","relationship":"The whole family and guests","sub":"The kitchen sink and dishwasher cost nothing extra but involve carrying dishes back and forth.","gap":"The sideboard has no spot for used dishes, waste or cleaning cloths. Responsibility for cleanup is unclear.","mechanism":"A dish rack hung on the side of the sideboard, waste sorting and a drawer for cloths and cleaner","action":"Keep the cleaning tools where the meal takes place.","how":"Finish eating, collect the dishes, find the bin and cloth together and wipe the counter clean.","proof":"Proposed targets: cleanup in ≤5 minutes and ≤1 family complaint a week.","tradeoff":"Odors, occupied space and cleaning","kill":"Within 2 weeks, the waste opening smells or the family still piles dishes in the sink.","insight":"A second cooking station needs a place to clear up at the end. Without it, the counter soon fills up.","evidence":"grey","evidenceNotes":"U1: The user supplied no evidence of cleanup disputes. Odor is an assumption to test with 3 households over 2 weeks.","statusReason":"The occasion makes sense. Hygiene remains untested.","short":null,"claim":"In households that share a dining room and argue about cleanup, the 10 minutes after dinner can leave dishes unclaimed on the table or in the sink. The sink and dishwasher cost nothing extra but require trips back and forth. No one owns the cleanup, and the sideboard has no place for dishes, waste or a cloth. A side-mounted rack, sorted bins and a drawer for cloths and cleaner support a simple rule: the last person to eat clears up. Proposed targets are ≤5 minutes and ≤1 family complaint a week. Odors, space and cleaning are the tradeoffs."},"C01":{"id":"C01","reading":"R3","title":"Wash-and-Chop Station","family":"waterless prep","status":"live","promise":"Wash and chop without plumbing","role":"Renters or households in finished homes where plumbing cannot be changed","occasion":"The 10 minutes before cooking","freq":"4–5 times a week","current":"Vegetables go to the kitchen sink for washing and are then carried back to the dining table.","relationship":"The cook and their family","sub":"The kitchen sink costs nothing extra but requires a round trip.","gap":"The sideboard has no water, so washing and chopping mean returning to the kitchen.","mechanism":"A 12 L clean-water tank, 10 L wastewater tank, folding colander and chopping board","action":"Move washing and chopping to the sideboard.","how":"Fill the tank, wash, drain, pour used water back into the wastewater tank and stow the unit.","proof":"Proposed targets: rinse vegetables for 2 with ≤3 L of water, without plumbing or mold over 2 weeks.","tradeoff":"Water changes, cleaning and counter space","kill":"Within 2 weeks, the tank grows mold or the water needs changing \u003e3 times per meal.","insight":"Water may be the sideboard's most serious constraint, ahead of electricity. A prep station without plumbing could be a real opportunity.","evidence":"yellow","evidenceNotes":"U1: The user supplied no plumbing details. Water consumption and hygiene are assumptions to test over 2 weeks of washing and chopping.","statusReason":"There is a strong use case. Hygiene remains untested.","short":{"rank":3,"why":"Addresses a fixed constraint: the sideboard has no running water","risk":"Water changes and mold","test":"Wash and chop for 2 weeks, checking for mold and measuring water use"},"claim":"Renters and households unable to alter the plumbing in a finished home carry vegetables to the kitchen sink and back to the dining table in the 10 minutes before cooking. The sink costs nothing extra, but a sideboard without water forces the round trip. A 12 L clean-water tank, 10 L wastewater tank, folding colander and chopping board make it possible to wash and chop without plumbing. Proposed targets are vegetables for 2 using ≤3 L of water and no mold over 2 weeks. Changing water, cleaning the unit and taking up counter space are the tradeoffs."},"C02":{"id":"C02","reading":"R3","title":"Folding Drain Board","family":"fold-out board","status":"needs-evidence","promise":"Chop and carry straight to the table","role":"People with a counter only 40 cm deep","occasion":"Before cooking or during meal prep","freq":"3–4 times a week","current":"The chopping board goes on the dining table, and the food has to be carried afterward.","relationship":"The cook","sub":"The dining table or kitchen counter costs nothing extra but is the wrong height.","gap":"The sideboard is too shallow to hold a chopping board and a plate together.","mechanism":"A 40 cm folding board combines chopping, draining and serving, folding down to just 10 cm.","action":"Turn the chopping board into a folding serving tray.","how":"Pull it out, chop, fold it up and carry it straight to the dining table.","proof":"Proposed targets: chop vegetables for 2 without drips, then fold the board down to ≤10 cm.","tradeoff":"Stability, cleaning and hardware","kill":"Within 2 weeks, the folding parts wobble or water seeps into the cabinet.","insight":"The missing feature may be the ability to make the sideboard counter larger for just a few minutes.","evidence":"grey","evidenceNotes":"U1: The user gave no counter dimensions. Stability is an assumption to test with 1 sample.","statusReason":"The concept is simple. The hardware remains untested.","short":null,"claim":"For someone with a counter only 40 cm deep, prep means using the dining table as a chopping surface and carrying the food afterward. The table and kitchen counter cost nothing extra but are the wrong height. The sideboard has room for a board or a plate, but not both. A 40 cm folding board combines chopping, draining and serving, folds to 10 cm and lets the cook carry food straight to the table. The aim is vegetables for 2, no drips and a folded size ≤10 cm. Stability, cleaning and hardware are the tradeoffs."},"C03":{"id":"C03","reading":"R3","title":"Rolling Prep Cart","family":"mobile prep cart","status":"needs-evidence","promise":"Roll in more counter space","role":"People who need temporary counter space between their kitchen and dining room","occasion":"While cooking or hosting","freq":"2–3 times a week","current":"The dining table doubles as a prep surface, with items carried back and forth.","relationship":"The whole family and guests","sub":"The dining table or kitchen counter costs nothing extra, but prep occupies the table.","gap":"The sideboard stays put when the cook moves.","mechanism":"A 40 cm-deep cart with a chopping board, seasonings, utensils, a bin bag and locking wheels","action":"Roll the prep surface wherever it is needed.","how":"Roll it beside the dining table, lock the wheels, chop or assemble food and roll it back.","proof":"Proposed targets: add 60 cm of work surface, support 15 kg and keep the walkway clear.","tradeoff":"Floor space, stability and cleaning","kill":"Within 2 weeks, the cart blocks the walkway or the wheels fail to lock.","insight":"A second cooking station could be a 40 cm counter on wheels.","evidence":"grey","evidenceNotes":"U1: The user gave no walkway dimensions. Stability is an assumption to test with 1 prototype cart.","statusReason":"The concept makes sense. How it fits people's movements remains untested.","short":null,"claim":"People needing an extra work surface between kitchen and dining room when cooking or hosting use the table for prep, carrying items back and forth. The table and kitchen counter cost nothing extra, but prep takes over the table and the sideboard cannot follow the cook. A 40 cm-deep cart with locking wheels, board, seasonings, utensils and a bin bag brings counter space where needed. The proposed targets are 60 cm of extra surface, a 15 kg load and a clear walkway. Floor space, stability and cleaning are the tradeoffs."},"C04":{"id":"C04","reading":"R3","title":"Waste and Food Scrap Bin","family":"waste port","status":"needs-evidence","promise":"Keep waste off the counter","role":"People who do lots of meal prep and have nowhere to put the waste","occasion":"While cooking or preparing food","freq":"Every day","current":"Bin bags hang from cabinet doors or pile up on the counter.","relationship":"The cook and their family","sub":"A bin and cabinet-door hook cost nothing extra but look untidy and can smell.","gap":"The sideboard has no concealed waste storage, and the counter quickly becomes cluttered.","mechanism":"A side-opening pull-out sorting bin, a small food scrap container and an activated-carbon lid","action":"Hide the waste opening in the side of the cabinet.","how":"Pull it out, sort the waste, push it back in and clear it weekly.","proof":"Proposed targets: no bin bags on the counter and no odor for 2 weeks.","tradeoff":"Odors, cleaning and cabinet space","kill":"Within 2 weeks, the food scraps smell or the waste opening jams.","insight":"Whether a counter stays usable depends on where the waste goes.","evidence":"grey","evidenceNotes":"U1: The user gave no waste disposal habits. Odor is an assumption to test over 2 weeks.","statusReason":"The concept makes sense. Hygiene remains untested.","short":null,"claim":"For people who prepare a lot of food with nowhere to put the waste, bin bags hang from cabinet doors or pile up on the counter. A bin and door hook cost nothing extra, but they look untidy and can smell. Without concealed waste storage, the sideboard quickly clutters up. A side-opening pull-out sorting bin, small food scrap container and activated-carbon lid promise to keep waste off the counter. The proposed targets are zero bin bags on the counter and no odor for 2 weeks. Odors, cleaning and the cabinet space it takes are the tradeoffs."},"D01":{"id":"D01","reading":"R4","title":"Induction Cooking Station","family":"induction zone","status":"live","promise":"Cook without an open flame","role":"People who want noodles or hot pot in the dining room without cooking fumes","occasion":"Dinner or a late-night meal","freq":"2–3 times a week","current":"A portable induction hob sits on the dining table with a power strip trailing on the floor.","relationship":"Family and guests","sub":"A portable induction hob costs ¥100–300, leaving heat dissipation and loose cables unresolved.","gap":"The sideboard has no open flame or extraction, and a hob enclosed in the cabinet struggles to shed heat.","mechanism":"A built-in induction hob with boil-dry protection, a timer, a water-resistant control panel and rear ventilation","action":"Give light cooking a permanent place at the sideboard.","how":"Set down a pot, choose the power level, set the timer, switch off and wipe the counter.","proof":"Proposed targets: cook for 2 in ≤15 minutes, keep the counter ≤60 °C and run for 2 weeks without failure.","tradeoff":"Power draw, heat dissipation and cookware","kill":"Within 2 weeks, the outlet overloads, heat damages the counter or steam damages the cabinet.","insight":"Safe operation determines which hot dishes belong at the sideboard.","evidence":"yellow","evidenceNotes":"U1: The user supplied no electrical details. Heat dissipation is an assumption to check with 1 built-in prototype and a 2-hour hot pot meal.","statusReason":"There is a strong use case. Heat dissipation remains untested.","short":{"rank":5,"why":"The most direct answer to the idea of a second place to cook","risk":"Heat dissipation and electrical demands","test":"Test 1 built-in prototype with a 2-hour hot pot meal"},"claim":"People who want noodles or hot pot without cooking fumes in the dining room use a portable induction hob for dinner or a late-night meal, with a power strip trailing on the floor. A ¥100–300 hob leaves loose cables and heat dissipation unresolved. The sideboard has neither an open flame nor extraction, and a hob in a cabinet sheds heat poorly. A built-in induction hob adds boil-dry protection, a timer, a water-resistant panel and rear ventilation for cooking without flame. The targets are a meal for 2 in ≤15 minutes, a counter ≤60 °C and 2 weeks without failure. Power, cooling and cookware are the tradeoffs."},"D02":{"id":"D02","reading":"R4","title":"Warming Drawer","family":"warming drawer","status":"needs-evidence","promise":"Keep the second dish warm","role":"People who cook several dishes that finish at different times","occasion":"Dinner or entertaining","freq":"2–3 times a week","current":"Finished dishes wait on the counter or in the oven, and the second dish cools down.","relationship":"Host and guests","sub":"The oven or microwave costs nothing extra but ties up an appliance.","gap":"The sideboard has nowhere to keep dishes warm, making it hard to time service.","mechanism":"A 40 cm warming drawer at 50–70 °C with space for plates and its own electrical outlet","action":"Build a place to keep food warm into the sideboard.","how":"Put the cooked dish in the drawer and take it out just before serving.","proof":"Proposed targets: hold for 30 minutes, keep the plate at ≥50 °C and prevent the food from drying out.","tradeoff":"Electricity, space and cleaning","kill":"Within 2 weeks, food dries out or heat from the drawer damages the finish.","insight":"A second cooking station can help solve the timing of serving the second dish.","evidence":"grey","evidenceNotes":"U1: The user gave no hosting frequency. Heat retention is an assumption to test with 1 prototype.","statusReason":"The concept makes sense. Safety remains untested.","short":null,"claim":"For people cooking several dishes for dinner or guests, dishes finish at different times. Food waits on the counter or in the oven, and the second dish cools. Using the oven or microwave costs nothing extra but ties up an appliance. With nowhere to hold hot food at the sideboard, serving is hard to coordinate. A 40 cm warming drawer with plate storage, its own outlet and a 50–70 °C range promises a warm second dish. The proposed target is 30 minutes at a plate temperature ≥50 °C without drying the food out. Electricity, space and cleaning are the tradeoffs."},"D03":{"id":"D03","reading":"R4","title":"Side-Draft Steam Hood","family":"steam capture","status":"needs-evidence","promise":"Keep steam off the wall","role":"People who use a rice cooker or steamer on the sideboard","occasion":"While cooking","freq":"Every day","current":"Steam rises directly onto the wall or upper cabinets.","relationship":"The whole family","sub":"The kitchen extractor or an open window costs nothing extra but is too far away.","gap":"The sideboard lacks extraction, and steam can damage the cabinet.","mechanism":"A low side-draft hood with a fan and condensate container, mounted without drilling","action":"Capture steam at the edge of the cabinet.","how":"Place the hood beside the appliance, switch it on and empty the collected water.","proof":"Proposed targets: no condensation on the wall, no cabinet swelling and no mold for 2 weeks.","tradeoff":"Noise, cleaning and effectiveness","kill":"Within 2 weeks, mold grows in the condensate container or steam still reaches the cabinet.","insight":"When cooking hot food on a sideboard, the cabinet is often the first thing to fail.","evidence":"grey","evidenceNotes":"U1: The user gave no information about steam-producing appliances. Performance is an assumption to check in a 2-week trial.","statusReason":"The concept makes sense. Performance remains untested.","short":null,"claim":"For people cooking with a rice cooker or steamer on the sideboard, steam hits the upper cabinets or wall. An existing kitchen extractor or open window costs nothing extra but is too far away. Without local extraction, steam can damage the cabinet. A low side-draft hood with a fan and condensate container mounts without drilling and promises to keep steam off the wall. The targets are no condensation, no cabinet swelling and no mold for 2 weeks. Noise, cleaning and effectiveness are the tradeoffs."},"D04":{"id":"D04","reading":"R4","title":"Full Second Kitchen","family":"full second kitchen","status":"killed","promise":"A second sink, stove and extractor","role":"People in large single-floor apartments or villas who want a full second kitchen","occasion":"Daily use or entertaining","freq":"Every day","current":"A butler’s pantry or separate Chinese-style and outer kitchens already serves this purpose.","relationship":"The whole family, domestic help and guests","sub":"A full second kitchen at ¥50,000–200,000","gap":"The sideboard lacks water supply, drainage, extraction and gas. The cost is high.","mechanism":"Fit a sink, induction hob, extractor and fridge into the sideboard.","action":"Build a full second kitchen.","how":"Alter the plumbing and wiring, install extraction and add a fridge.","proof":"A full second kitchen","tradeoff":"Water supply, drainage, extraction, cost and building requirements","kill":"A sideboard is furniture. A full second kitchen needs construction work, drainage and extraction, making it a separate project.","insight":"A sideboard's opportunity is light meal prep. It cannot replicate a full second kitchen.","evidence":"yellow","evidenceNotes":"U1: The user supplied no home type or budget. Cost and building requirements are general assumptions, with no price check.","statusReason":"Water supply, drainage, extraction and cost rule it out as a standalone concept.","short":null,"claim":"For people in large single-floor apartments or villas who want a complete second kitchen for everyday use or entertaining, a butler’s pantry or separate Chinese-style and outer kitchens already fills that role. A full second kitchen is estimated at ¥50,000–200,000. A sideboard lacks water supply, drainage, extraction and gas, and adding them is costly. Fitting a sink, induction hob, extractor and fridge into the furniture promises a second sink, stove and extractor, with a full second kitchen as the goal. Water supply, drainage, extraction, cost and building requirements are the tradeoffs."}},"grill":{"A01":{"rounds":[{"q":"Is the breakfast station just a toaster moved onto the sideboard?","consider":"A new location alone gives people little reason to change their habits. The station needs to change the morning rush, free counter space and make cleaning easier.","decision":"Continue, with a tighter promise: “Breakfast without crossing the kitchen.”"},{"q":"Can a 40 cm-deep cabinet cope with crumbs and steam?","consider":"Toasters shed crumbs and kettles release steam. The cabinet needs a removable crumb tray, a moisture-resistant surface and ventilation at the back.","decision":"Narrow: combine A01 and A04 into a 40 cm breakfast module first. Do not sell the counter on its own."},{"q":"Who cleans a breakfast station in a shared room?","consider":"In the dining room, responsibility for cleaning is unclear. People may abandon the station if they have to wipe it down every day.","decision":"Narrow: make the removable, washable tray a core part of the station rather than an accessory."}],"verdict":"narrow","note":"Keep the breakfast concept. Start with a 40 cm breakfast module and test it with 5 households for 2 weeks."},"C01":{"rounds":[{"q":"Without plumbing, is washing and chopping here really easier than going back to the kitchen?","consider":"Changing the water and emptying the wastewater also take trips. If one meal needs 3 water changes, the idea falls apart.","decision":"Narrow: offer light washing and chopping for 2. Leave larger portions and greasy dishes out of the promise."},{"q":"Will the bucket or colander grow mold?","consider":"This wet area sits in a dining room and may be cleaned infrequently. Parts need to come apart and air-dry, with no hard-to-reach corners.","decision":"Narrow: run a 2-week hygiene test first. Drop the concept if mold appears."},{"q":"Is this a product or just a bucket?","consider":"People can buy a bucket and basin at a camping store. The difference has to come from how the unit fits inside the cabinet, folds away and handles wastewater.","decision":"Continue, then narrow: build a washing and chopping module that stows inside a 40 cm cabinet."}],"verdict":"narrow","note":"Keep the prep station without plumbing. Start with a 2-week test of hygiene and water use."},"D04":{"rounds":[{"q":"Doesn’t a butler’s pantry already serve as a full second kitchen?","consider":"A butler’s pantry is a separate space with a sink, drainage, extraction and building work. A sideboard has none of those provisions.","decision":"Drop it as a standalone concept. Keep it as a counterexample."},{"q":"Could a sink, induction hob and extractor all fit inside the sideboard?","consider":"It would need water supply and drainage, extraction, gas, electrical work and waterproofing. The cost would approach a small kitchen renovation, taking it beyond furniture.","decision":"Drop it. This would be a renovation project rather than a sideboard product."},{"q":"What would bring D04 back into consideration?","consider":"If someone is willing to remodel the dining room for a 1.2 m second sink and stove, that belongs in a butler’s pantry brief, outside this one.","decision":"kill as standalone; keep as counterfactual."}],"verdict":"kill","note":"A sideboard cannot accommodate a full second kitchen. Keep this concept as a counterexample."}},"handoff":["A01","B01","C01"],"language":"en"}</script>
<script>
'use strict';
const $=s=>document.getElementById(s);
const DATA=JSON.parse($('atlasData').textContent);
const reframed=DATA.readings!==undefined;
for(const key of ['cards','readings','lenses','grill'])DATA[key]=Object.assign(Object.create(null),DATA[key]);
const pristineApp=$('app').cloneNode(true);
const languageKey='idea-atlas.language';
let lifetime;
let initialLanguage='en';
try { if(localStorage.getItem(languageKey)==='zh') initialLanguage='zh'; } catch {}
function renderAtlas(language,saved){
 if(lifetime){
   lifetime.abort();
   $('app').replaceWith(pristineApp.cloneNode(true));
 }
 lifetime=new AbortController();
 const listen=(target,type,handler)=>target.addEventListener(type,handler,{signal:lifetime.signal});
 const isEnglish=language==='en';
 const t=(en,zh)=>isEnglish?en:zh;
 document.documentElement.lang=t('en','zh-CN');
 $('brandName').textContent=t('Idea Atlas','点子地图');
 for(const group of document.querySelectorAll('.language-switch')){
   group.setAttribute('aria-label',t('Interface language','界面语言'));
   group.title=t('Switch interface language','切换界面语言');
   for(const button of group.querySelectorAll('button')){
     button.setAttribute('aria-pressed',String(button.dataset.language===language));
   }
 }
for(const element of document.querySelectorAll('[data-copy-en]')){
  element.textContent=t(element.dataset.copyEn,element.dataset.copyZh);
}
for(const element of document.querySelectorAll('[data-aria-en]')){
  element.setAttribute('aria-label',t(element.dataset.ariaEn,element.dataset.ariaZh));
}
for(const element of document.querySelectorAll('[data-title-en]')){
  element.title=t(element.dataset.titleEn,element.dataset.titleZh);
}
const cards=Object.values(DATA.cards), handoff=DATA.handoff||[];
const branchType=reframed?'reading':'lens', branchPrefix=branchType+':', branchLabel=reframed?'读法':'视角';
const branches=reframed?DATA.readings:DATA.lenses;
const branchEntries=Object.entries(branches);
// Bind the same tint to a branch, its cards and the connecting lines.
const branchTone=new Map(branchEntries.map(([id],i)=>[id,String(i%6)]));
const branchKey=card=>branchPrefix+card[branchType];
function ideaCount(n) {
  return t(n+(n===1?' idea':' ideas'),n+' 个方向');
}
const groupCount=branchEntries.length;
const englishGroup=reframed?(groupCount===1?'perspective':'perspectives'):(groupCount===1?'lens':'lenses');
const totals=t(groupCount+' '+englishGroup,groupCount+' 个'+branchLabel)+' · '+ideaCount(cards.length);
const brief=DATA.project.title, subtitle=DATA.project.subtitle||'';
const actionFor=card=>card.action||card.mechanism||card.promise||'';
document.title=brief+' · '+t('Idea Atlas','点子地图');

const labels={live:t("Promising", "可推进"),'needs-evidence':t("Needs evidence", "待补证"),killed:t("Ruled out", "已淘汰"),duplicate:t("Merged", "已合并"),seed:t("Seed", "种子"),variant:t("Variant", "变体")};
function esc(s){return String(s??'').replace(/[&<>"']/g,v=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[v]));}
const sourceAttrs=' dir="auto" lang="'+esc(DATA.language||'')+'"';
function statusLabel(c){return labels[c.status]||c.status}
function badge(c){return '<span class="badge '+esc(c.status)+'"><i aria-hidden="true" class="statusmark mark-'+esc(c.status)+'"></i>'+esc(statusLabel(c))+'</span>'}
const icons={filter:'<path d="M3 6h18M6 12h12M9 18h6"/>',tree:'<path d="m3.2 6.2 5.7-2.6 6.2 2.7 5.7-2.6v14.2l-5.7 2.5-6.2-2.7-5.7 2.6zM8.9 3.6v14.1m6.2-11.4v14.1"/>',list:'<path d="M8 6h12M8 12h12M8 18h12M3 6h.1M3 12h.1M3 18h.1"/>',plus:'<path d="M12 5v14M5 12h14"/>',minus:'<path d="M5 12h14"/>',close:'<path d="m6 6 12 12M18 6 6 18"/>',fit:'<path d="M9 4H4v5M15 4h5v5M4 15v5h5M20 15v5h-5"/>'};
document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML='<svg aria-hidden="true" class="icon" viewBox="0 0 24 24">'+icons[el.dataset.icon]+'</svg>');
function detailRows(rows) {
  const present = rows.filter(([,value]) => value !== undefined && value !== null && value !== '');

 body.scrollTop=0;syncReaderMode();paint();
 if(state.mode==='map')keepVisible(key);
 if(state.mobile||fromDrawer||trigger?.matches(':focus-visible'))$('closeDrawer').focus({preventScroll:true});
}
function updateDetailHeader(){
 const body=$('drawerBody'),hero=body.querySelector('.card-hero');
 drawer.classList.toggle('scrolled',!!hero && body.scrollTop>=hero.offsetHeight-6);
}
function showCardTab(tab) {
 const body=$('drawerBody');
 const hero=body.querySelector('.card-hero');
 const y=Math.min(body.scrollTop,hero.offsetHeight);
 for(const other of tab.parentElement.querySelectorAll('[role=tab]')){
   const active=other===tab;
   other.setAttribute('aria-selected',String(active));
   other.tabIndex=active?0:-1;
   $(other.getAttribute('aria-controls')).hidden=!active;
 }
 body.scrollTop=y;
 updateDetailHeader();
}
$('drawerBody').addEventListener('scroll',updateDetailHeader,{passive:true});
$('drawerBody').addEventListener('click',e=>{
 const tab=e.target.closest('[role=tab]');
 if(tab) showCardTab(tab);
});
$('drawerBody').addEventListener('keydown',e=>{
 const tab=e.target.closest('[role=tab]');
 if(!tab || !['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;
 const tabs=[...tab.parentElement.querySelectorAll('[role=tab]')],i=tabs.indexOf(tab);
 const next=e.key==='Home'?0:e.key==='End'?tabs.length-1:(i+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;
 e.preventDefault(); tabs[next].focus({preventScroll:true}); showCardTab(tabs[next]);
});

function syncIndexSelection(){
 for(const button of $('indexTable').querySelectorAll('.pa-indexopen')){
  if(button.dataset.card===state.selected)button.setAttribute('aria-current','true');
  else button.removeAttribute('aria-current');
 }
}
function closeDetail(restore=false){
 if(drawer.hidden)return;
 drawer.hidden=true;syncReaderMode();state.selected=null;syncIndexSelection();paint();
 if(state.auto&&state.mode==='map')fitView(true);
 if(restore&&lastTrigger?.isConnected)lastTrigger.focus({preventScroll:true});
 lastTrigger=null;
}
function setFilter(f){
 if(!rules.some(r=>r[0]===f))return;
 state.filter=f;
 const match=matched();
 const filterRule=rules.find(rule=>rule[0]===f);
 $('filterLabel').textContent=f==='all'?t("Filter", "筛选"):filterRule[1];
 $('filterTotal').textContent=match.length;
 $('filterTotal').hidden=f==='all';
 $('filterTrigger').classList.toggle('has-filter',f!=='all');
 $('filterTrigger').setAttribute('aria-label',t('Filter ideas. Selected: '+filterRule[1]+', '+ideaCount(match.length),'筛选方向，当前为'+filterRule[1]+t(", ", "，")+match.length+' 个方向'));
 if(!$('filters').hidden) toggleFilters(false,true);
 if(state.selected&&DATA.cards[state.selected]&&!match.includes(DATA.cards[state.selected]))closeDetail();
 if(f!=='all'&&state.selected?.startsWith(branchPrefix)&&!match.some(c=>branchKey(c)===state.selected))closeDetail();
 $('filters').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.filter===f)));
 $('indexTable').innerHTML=indexContent(match);syncIndexSelection();$('indexCount').textContent=ideaCount(match.length);paint();
}
function setMode(mode){
 state.mode=mode;closeDetail();
 const map=mode==='map';view.hidden=!map;$('indexView').hidden=map;$('zoomTools').hidden=!map;$('keyHint').hidden=!map;
 $('modeMap').setAttribute('aria-pressed',String(map));$('modeIndex').setAttribute('aria-pressed',String(!map));
 if(map&&needsLayout())draw();
 if(map&&state.auto)fitView(true);
}
let swallowClick=false;
listen(document,'click',e=>{
 if(swallowClick&&view.contains(e.target)){e.preventDefault();return}
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.card)openDetail(b.dataset.card,b);
 else if(b.dataset[branchType])openDetail(branchPrefix+b.dataset[branchType],b);
 else if('root' in b.dataset)openDetail('root',b);
 else if(b.dataset.filter)setFilter(b.dataset.filter);
});
$('closeDrawer').onclick=()=>closeDetail(true);$('modeMap').onclick=()=>setMode('map');$('modeIndex').onclick=()=>setMode('index');
$('zoomIn').onclick=()=>zoom(state.scale*1.25);$('zoomOut').onclick=()=>zoom(state.scale/1.25);$('actual').onclick=()=>zoom(1);$('fit').onclick=()=>fitView();
view.addEventListener('focusin',e=>{
 const button=e.target.closest('.node');
 state.focus=button?.matches(':focus-visible')?button.dataset.key:null;
 if(state.focus) keepVisible(state.focus);
 paint();
});
view.addEventListener('focusout',()=>{state.focus=null;paint()});
const pointers=new Map();let gesture=null,didDrag=false;
function beginGesture(){
 const p=[...pointers.values()];if(!p.length){gesture=null;return}
 const a=p[0],b=p[1]||a;
 gesture={x:(a.x+b.x)/2,y:(a.y+b.y)/2,d:Math.hypot(a.x-b.x,a.y-b.y),tx:state.x,ty:state.y,s:state.scale};
}
view.addEventListener('pointerdown',e=>{
 if(e.button!==0)return;const r=view.getBoundingClientRect();
 if(!pointers.size){didDrag=false;swallowClick=false}
 pointers.set(e.pointerId,{x:e.clientX-r.left,y:e.clientY-r.top});beginGesture();
 if(pointers.size>1)didDrag=true;
});
view.addEventListener('pointermove',e=>{
 if(!pointers.has(e.pointerId)||!gesture)return;
 const r=view.getBoundingClientRect();pointers.set(e.pointerId,{x:e.clientX-r.left,y:e.clientY-r.top});
 const [a,b=a]=[...pointers.values()],x=(a.x+b.x)/2,y=(a.y+b.y)/2;
 if(!didDrag&&Math.hypot(x-gesture.x,y-gesture.y)<4)return;
 didDrag=true;view.setPointerCapture(e.pointerId);view.classList.add('drag');state.auto=false;
 const next=gesture.d>0?clamp(gesture.s*Math.hypot(a.x-b.x,a.y-b.y)/gesture.d,minZoom,maxZoom):gesture.s;
 state.scale=next;state.x=x-(gesture.x-gesture.tx)*next/gesture.s;state.y=y-(gesture.y-gesture.ty)*next/gesture.s;transform();
});
function endPointer(e){
 if(!pointers.delete(e.pointerId))return;beginGesture();
 if(!pointers.size){view.classList.remove('drag');swallowClick=didDrag;setTimeout(()=>{swallowClick=false},0)}
}
listen(window,'pointerup',endPointer);listen(window,'pointercancel',endPointer);
view.addEventListener('wheel',e=>{
 e.preventDefault();const r=view.getBoundingClientRect();
 const unit=e.deltaMode===1?16:e.deltaMode===2?view.clientHeight:1;
 if(e.shiftKey){state.auto=false;state.x-=(e.deltaX||e.deltaY)*unit;transform()}
 else zoom(state.scale*Math.exp(-clamp(e.deltaY*unit,-300,300)*.0028),e.clientX-r.left,e.clientY-r.top);
},{passive:false});
listen(document,'keydown',e=>{
 if(e.key==='Escape'){
   if(!$('filters').hidden){e.preventDefault();toggleFilters(false,true);return}
   closeDetail(true);return
 }
 if(state.mode!=='map'||!view.contains(e.target)||e.ctrlKey||e.metaKey||e.altKey)return;
 const move={ArrowLeft:[55,0],ArrowRight:[-55,0],ArrowUp:[0,55],ArrowDown:[0,-55]}[e.key];
 if(move){e.preventDefault();state.auto=false;state.x+=move[0];state.y+=move[1];transform()}
 else if(['+','=','-'].includes(e.key)){e.preventDefault();zoom(state.scale*(e.key==='-'?.8:1.25))}
 else if(e.key.toLowerCase()==='f')fitView();
});
$('app').addEventListener('click',e=>{
 const button=e.target.closest('[data-language]');
 if(!button||button.dataset.language===language)return;
 const next=button.dataset.language;
 try {localStorage.setItem(languageKey,next)} catch {}
 const selectedTab=drawer.querySelector('[role=tab][aria-selected=true]');
 const openFolds=[...drawer.querySelectorAll('details')].map(d=>d.open);
 renderAtlas(next,{
   mode:state.mode, filter:state.filter, selected:state.selected,
   pane:selectedTab?.dataset.pane, openFolds, scroll:$('drawerBody').scrollTop,
   indexScroll:$('indexView').scrollTop, drawerButton:drawer.contains(button),
   camera:state.auto?null:{scale:state.scale,x:state.x,y:state.y}
 });
});
draw();drawFilters();setFilter(saved?.filter||'all');fitView(true);
if(saved){
 setMode(saved.mode);
 if(saved.camera){Object.assign(state,saved.camera,{auto:false});transform()}
 if(saved.selected){
   const mapTrigger=geometry.rects.get(saved.selected)?.el;
   const trigger=saved.mode==='index'?[...$('indexTable').querySelectorAll('[data-card]')].find(el=>el.dataset.card===saved.selected):mapTrigger;
   openDetail(saved.selected,trigger);
   const tab=saved.pane && $('card-tab-'+saved.pane);
   if(tab)showCardTab(tab);
   drawer.querySelectorAll('details').forEach((item,i)=>item.open=!!saved.openFolds[i]);
   $('drawerBody').scrollTop=saved.scroll;
   updateDetailHeader();
 }
 $('indexView').scrollTop=saved.indexScroll;
 const group=saved.drawerButton?drawer.querySelector('.language-switch'):document.querySelector('.topbar .language-switch');
 group.querySelector('[aria-pressed=true]').focus({preventScroll:true});
}
listen(window,'resize',()=>{
 if(state.mode!=='map')return;
 if(needsLayout()){
   const oldWidth=geometry.w, oldHeight=geometry.h;
   const focusedKey=document.activeElement?.dataset.key;
   draw();
   if(!state.auto){
     state.x=state.x*geometry.w/oldWidth;
     state.y=state.y*geometry.h/oldHeight;
     transform();
   }
   if(focusedKey)geometry.rects.get(focusedKey)?.el.focus({preventScroll:true});
 }
 if(state.auto)fitView(true);
 else if(state.selected)keepVisible(state.selected);
});

}
renderAtlas(initialLanguage,null);
</script></body></html>
